  // DETAIL VIEW
  // ============================================================
  function isLinkColumn(colName) {
    return /go\s*to/i.test(colName) && /web|link/i.test(colName);
  }
  function isTopicColumn(colName) {
    return /^topic$/i.test(colName.trim());
  }
  function isStatusColumn(colName) {
    return /^current\s*status$/i.test(colName.trim());
  }
  function isPriorityColumn(colName) {
    return /^priority$/i.test(colName.trim());
  }
  function isOpenDayColumn(colName) {
    return /^open\s*day$/i.test(colName.trim());
  }
  function isCcNumberColumn(colName) {
    return /^cc\s*number$/i.test(colName.trim());
  }
  function isDateColumn(colName) {
    return /^date$/i.test(colName.trim());
  }
  function isCustomerColumn(colName) {
    return /^customer$/i.test(colName.trim());
  }
  function isInquiryTypeColumn(colName) {
    return /^inquiry\s*type$/i.test(colName.trim());
  }
  function isCaseStatusColumn(colName) {
    return /^case\s*status$/i.test(colName.trim());
  }

  function findColumnKey(keys, target) {
    const t = target.toLowerCase();
    return keys.find(k => k.toLowerCase() === t) || null;
  }

  function openDetailView(title, records) {
    savedGraphScrollY = window.scrollY || window.pageYOffset || 0;
    previousDetailState = null;

    openDetailViewInternal(title, records, false);
  }

  function openDetailViewFromDetail(title, records) {
    previousDetailState = {
      title: detailTitle.textContent,
      records: detailRecordsAll.slice(),
      scrollY: window.scrollY || window.pageYOffset || 0,
      chartsData: detailChartsData,
      chartsVisibleMobile: detailChartsVisibleMobile
    };

    openDetailViewInternal(title, records, true);
  }

  function openDetailViewInternal(title, records, keepPrevState) {
    if (!keepPrevState) {
      savedGraphScrollY = window.scrollY || window.pageYOffset || 0;
      previousDetailState = null;
    }

    detailRecordsAll = records || [];
    detailSearch = { cc: "", topic: "" };
    detailSearchCc.value = "";
    detailSearchTopic.value = "";

    detailTitle.textContent = title;

    const showCharts = title === ONGOING_DETAIL_TITLE;
    
    if (showCharts && statusMap.size === 0) {
      loadStatuses().then(() => {
        detailChartsData = buildDetailChartsData(detailRecordsAll);
        renderDetailCharts();
      });
    } else {
      detailChartsData = showCharts ? buildDetailChartsData(detailRecordsAll) : null;
    }

    detailChartsVisibleMobile = false;
    updateDetailChartsVisibility();

    if (showCharts) {
      renderDetailCharts();
    } else {
      clearDetailCharts();
    }

    renderDetailTable();

    closeContentModal();
    resetSliceInteraction();
    hideAllViews();
    detailView.style.display = "block";
    pageTitle.textContent = TITLE_DETAIL;
    updateHeaderOffset();

    window.scrollTo(0, 0);
  }

  // ============================================================
  // DETAIL CHARTS
  // ============================================================
  function buildDetailChartsData(records) {
    return {
      site:     buildDetailSlicesByField(records, "Customer", "Site"),
      inquiry:  buildDetailSlicesByField(records, "Inquiry type", "Inquiry type"),
      status:   buildDetailSlicesByStatusField(records, FIELD_CURRENT_STATUS, "Current Status"),
      priority: buildDetailSlicesByStatusField(records, FIELD_PRIORITY, "Priority")
    };
  }

  function buildDetailSlicesByField(records, fieldName, chartTitle) {
    const counts = new Map();
    records.forEach(r => {
      const key = String(r[fieldName] ?? "").trim() || "Unspecified";
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => {
        const matching = records.filter(
          r => (String(r[fieldName] ?? "").trim() || "Unspecified") === label
        );
        return {
          label,
          value,
          color: CHART_PALETTE[i % CHART_PALETTE.length],
          records: matching,
          detailTitle: `${chartTitle} — ${label}`
        };
      });
  }

  function buildDetailSlicesByStatusField(records, statusField, chartTitle) {
    const counts = new Map();
    records.forEach(r => {
      const ccKey = Object.keys(r).find(k => /^cc\s*number$/i.test(k));
      const cc = ccKey ? normalizeCc(r[ccKey]) : "";
      const entry = getStatusEntry(cc);
      const val = String(entry[statusField] ?? "").trim() || "Unspecified";
      counts.set(val, (counts.get(val) || 0) + 1);
    });

    const colorFn = statusField === FIELD_PRIORITY
      ? getPriorityColor
      : getStatusColor;

    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value]) => {
        const matching = records.filter(r => {
          const ccKey = Object.keys(r).find(k => /^cc\s*number$/i.test(k));
          const cc = ccKey ? normalizeCc(r[ccKey]) : "";
          const entry = getStatusEntry(cc);
          return (String(entry[statusField] ?? "").trim() || "Unspecified") === label;
        });
        return {
          label,
          value,
          color: colorFn(label),
          records: matching,
          detailTitle: `${chartTitle} — ${label}`
        };
      });
  }

  function renderDetailCharts() {
    if (!detailChartsData) return;

    const total = detailRecordsAll.length;

    renderPieCard(detailChartSite, "Site", detailChartsData.site, total);
    renderPieCard(detailChartInquiry, "Inquiry type", detailChartsData.inquiry, total);
    renderPieCard(detailChartStatus, "Current Status", detailChartsData.status, total);
    renderPieCard(detailChartPriority, "Priority", detailChartsData.priority, total);
  }

  function clearDetailCharts() {
    detailChartSite.replaceChildren();
    detailChartInquiry.replaceChildren();
    detailChartStatus.replaceChildren();
    detailChartPriority.replaceChildren();
  }

  function updateDetailChartsVisibility() {
    const hasCharts = !!detailChartsData;

    if (!hasCharts) {
      detailCharts.classList.remove("show");
      toggleDetailChartsBtn.classList.remove("visible");
      return;
    }

    if (isMobile) {
      toggleDetailChartsBtn.classList.add("visible");
      toggleDetailChartsBtn.textContent = detailChartsVisibleMobile
        ? "📉 Hide Graph"
        : "📊 Show graph";
      detailCharts.classList.toggle("show", detailChartsVisibleMobile);
    } else {
      toggleDetailChartsBtn.classList.remove("visible");
      detailCharts.classList.add("show");
    }
  }

  // ============================================================
  // RENDER DETAIL TABLE
  // ============================================================
  function renderDetailTable() {
    detailThead.replaceChildren();
    detailTbody.replaceChildren();
    selectedDetailRow = null;
    hideStatusMenu();

    detailColumnLabels.length = 0;
    detailColTypes = [];

    const records = detailRecordsAll;

    if (!records || records.length === 0) {
      detailCount.textContent = "— 0 record(s)";
      detailColumns = [];
      const trHead = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = "(no columns)";
      trHead.appendChild(th);
      detailThead.appendChild(trHead);

      const tr = document.createElement("tr");
      tr.className = "empty-row";
      const td = document.createElement("td");
      td.textContent = "No records.";
      tr.appendChild(td);
      detailTbody.appendChild(tr);

      renderHiddenColsToolbar(() => renderDetailTableRows());
      return;
    }

    const columnSet = new Set();
    records.forEach(r => {
      Object.keys(r).forEach(k => {
        if (!k.startsWith("__")) columnSet.add(k);
      });
    });
    let columns = [...columnSet];

    const ccIdx = columns.findIndex(c => /^cc\s*number$/i.test(c.trim()));
    const dateIdx = columns.findIndex(c => /^date$/i.test(c.trim()));
    if (ccIdx >= 0 && dateIdx >= 0) {
      const tmp = columns[ccIdx];
      columns[ccIdx] = columns[dateIdx];
      columns[dateIdx] = tmp;
    }

    const insertAfter = columns.findIndex(c => /^case\s*status$/i.test(c.trim()));
    const customCols = [STATUS_COL_NAME, PRIORITY_COL_NAME, OPENDAY_COL_NAME];

    customCols.forEach(name => {
      const idx = columns.findIndex(c => c.toLowerCase() === name.toLowerCase());
      if (idx >= 0) columns.splice(idx, 1);
    });

    if (insertAfter >= 0) {
      columns.splice(insertAfter + 1, 0, ...customCols);
    } else {
      columns.push(...customCols);
    }

    detailColumns = columns;

    const trHead = document.createElement("tr");
    columns.forEach(col => {
      const th = document.createElement("th");
      th.textContent = col;
      th.title = col;

      let colType = "";
      if (isCcNumberColumn(col)) colType = "ccnumber";
      else if (isDateColumn(col)) colType = "date";
      else if (isCustomerColumn(col)) colType = "customer";
      else if (isTopicColumn(col)) colType = "topic";
      else if (isInquiryTypeColumn(col)) colType = "inquirytype";
      else if (isLinkColumn(col)) colType = "link";
      else if (isCaseStatusColumn(col)) colType = "casestatus";
      else if (isStatusColumn(col)) colType = "status";
      else if (isPriorityColumn(col)) colType = "priority";
      else if (isOpenDayColumn(col)) colType = "openday";

      if (colType) th.dataset.colType = colType;
      trHead.appendChild(th);

      detailColumnLabels.push(col);
      detailColTypes.push(colType);
    });
    detailThead.appendChild(trHead);

    attachColumnHideButtons(trHead, () => renderDetailTableRows());
    updateColgroup();

    renderDetailTableRows();
    applyHiddenColumns();
    renderHiddenColsToolbar(() => renderDetailTableRows());
  }

  function renderDetailTableRows() {
    detailTbody.replaceChildren();
    selectedDetailRow = null;
    hideStatusMenu();

    const records = detailRecordsAll;
    if (!records || records.length === 0) return;

    const columns = detailColumns;
    if (!columns || columns.length === 0) return;

    const ccKey = findColumnKey(columns, "CC NUMBER");
    const topicKey = findColumnKey(columns, "TOPIC");

    const filtered = records.filter(r => {
      if (detailSearch.cc && ccKey) {
        const v = String(r[ccKey] ?? "").toLowerCase();
        if (!v.includes(detailSearch.cc)) return false;
      }
      if (detailSearch.topic && topicKey) {
        const v = String(r[topicKey] ?? "").toLowerCase();
        if (!v.includes(detailSearch.topic)) return false;
      }
      return true;
    });

    const isFiltered = detailSearch.cc !== "" || detailSearch.topic !== "";
    detailCount.textContent = isFiltered
      ? `— ${filtered.length} / ${records.length} record(s)`
      : `— ${records.length} record(s)`;

    if (filtered.length === 0) {
      const tr = document.createElement("tr");
      tr.className = "empty-row";
      const td = document.createElement("td");
      td.colSpan = columns.length || 1;
      td.textContent = "No matching records.";
      tr.appendChild(td);
      detailTbody.appendChild(tr);
      return;
    }

    const colFlags = columns.map(col => ({
      link: isLinkColumn(col),
      status: isStatusColumn(col),
      priority: isPriorityColumn(col),
      openday: isOpenDayColumn(col),
      topic: isTopicColumn(col)
    }));

    const fragment = document.createDocumentFragment();
    filtered.forEach(r => {
      const tr = document.createElement("tr");
      tr.className = "detail-row";

      const caseStatusVal = String(
        r["CASE STATUS"] ?? r["Case Status"] ?? r["case status"] ?? ""
      ).trim();
      const isOnGoing = caseStatusVal.toLowerCase() === "on going";

      columns.forEach((col, idx) => {
        const td = document.createElement("td");
        const colType = detailColTypes[idx] || "";
        if (colType) td.dataset.colType = colType;

        const val = r[col];
        const flags = colFlags[idx];

        if (flags.link) {
          const url = String(val ?? "").trim();
          if (url && url !== "#") {
            const link = document.createElement("a");
            link.className = "detail-link-btn";
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Open";
            link.title = url;
            link.addEventListener("click", (e) => e.stopPropagation());
            td.appendChild(link);
          } else {
            td.textContent = "";
          }
        } else if (flags.status) {
          if (isOnGoing) buildEditableCell(td, r, "current-status");
        } else if (flags.priority) {
          if (isOnGoing) buildEditableCell(td, r, "priority");
        } else if (flags.openday) {
          buildOpenDayCell(td, r);
        } else {
          td.textContent = val == null ? "" : String(val);
          if (!flags.topic) td.title = td.textContent;
        }

        tr.appendChild(td);
      });

      fragment.appendChild(tr);
    });

    detailTbody.appendChild(fragment);
    applyHiddenColumns();
  }

  // ============================================================
  // Editable cells
  // ============================================================
  function buildEditableCell(td, record, type) {
    const ccKey = Object.keys(record).find(k => /^cc\s*number$/i.test(k));
    const cc = ccKey ? normalizeCc(record[ccKey]) : "";
    const entry = getStatusEntry(cc);

    const isPriority = type === "priority";
    const fieldName = isPriority ? FIELD_PRIORITY : FIELD_CURRENT_STATUS;
    const value = String(entry[fieldName] ?? "").trim();

    const cell = document.createElement("span");
    cell.className = "status-cell";
    cell.dataset.cc = cc;
    cell.dataset.field = fieldName;
    cell.dataset.value = value;
    cell.dataset.type = type;

    if (!cc) {
      cell.classList.add("empty");
      cell.textContent = "no CC";
      td.appendChild(cell);
      return;
    }

    if (value) {
      const badge = document.createElement("span");
      badge.className = isPriority ? "priority-badge" : "status-badge";
      if (isPriority) badge.dataset.priority = value;
      else badge.dataset.status = value;
      badge.textContent = value;
      cell.appendChild(badge);
    } else {
      cell.classList.add("empty");
      cell.textContent = isPriority
        ? "— (long-press 5s to set priority)"
        : "— (long-press 5s to set status)";
    }

    attachLongPressHandler(cell, type);
    td.appendChild(cell);
  }

  function buildOpenDayCell(td, record) {
    const ccKey = Object.keys(record).find(k => /^cc\s*number$/i.test(k));
    const cc = ccKey ? normalizeCc(record[ccKey]) : "";

    const entry = getStatusEntry(cc);
    let openDay = entry[FIELD_OPEN_DAY];
    if (openDay == null || openDay === "" || isNaN(Number(openDay))) {
      openDay = computeOpenDay(record["DATE"]);
    }

    const cell = document.createElement("span");
    cell.className = "status-cell readonly";
    cell.title = "Open day (không thể sửa)";

    if (openDay == null || isNaN(Number(openDay))) {
      cell.textContent = "—";
    } else {
      cell.textContent = String(openDay);
    }

    td.appendChild(cell);
  }

  function computeOpenDay(dateStr) {
    if (!dateStr) return null;
    const s = String(dateStr).trim();
    if (!s) return null;

    let date = null;

    if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
      const d = new Date(s);
      if (!isNaN(d.getTime())) date = d;
    }

    if (!date) {
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (m) {
        const month = parseInt(m[1], 10);
        const day   = parseInt(m[2], 10);
        let year    = parseInt(m[3], 10);
        if (year < 100) year = 2000 + year;
        const d = new Date(year, month - 1, day);
        if (!isNaN(d.getTime())) date = d;
      }
    }

    if (!date) return null;

    const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const today  = new Date();
    today.setHours(0, 0, 0, 0);

    const diffMs = today.getTime() - target.getTime();
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
  }

  function attachLongPressHandler(cell, type) {
    let holdTimer = null;
    let rafId = null;
    let startTime = 0;
    let fired = false;
    let startX = 0;
    let startY = 0;

    const HOLD_MOVE_TOLERANCE = 12;

    const cleanup = () => {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      cell.classList.remove("hold-progress");
      cell.style.removeProperty("--hold-progress");
    };

    const tick = () => {
      const elapsed = performance.now() - startTime;
      const pct = Math.min(100, (elapsed / HOLD_MS) * 100);
      cell.style.setProperty("--hold-progress", `${pct}%`);
      if (elapsed < HOLD_MS) rafId = requestAnimationFrame(tick);
    };

    const start = (evt) => {
      if (evt.button != null && evt.button !== 0) return;
      const point = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
      startX = point.clientX ?? 0;
      startY = point.clientY ?? 0;

      fired = false;
      startTime = performance.now();
      cell.classList.add("hold-progress");
      cell.style.setProperty("--hold-progress", "0%");

      hideStatusMenu();

      holdTimer = setTimeout(() => {
        fired = true;
        cleanup();
        openValueMenu(cell, type);
      }, HOLD_MS);

      rafId = requestAnimationFrame(tick);
    };

    const move = (evt) => {
      if (!holdTimer && !fired) return;
      const point = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
      const dx = (point.clientX ?? 0) - startX;
      const dy = (point.clientY ?? 0) - startY;
      if (Math.hypot(dx, dy) > HOLD_MOVE_TOLERANCE) cleanup();
    };

    const end = () => { cleanup(); };

    cell.addEventListener("mousedown", start);
    cell.addEventListener("touchstart", start, { passive: true });
    cell.addEventListener("mousemove", move);
    cell.addEventListener("touchmove", move, { passive: true });
    cell.addEventListener("mouseup", end);
    cell.addEventListener("mouseleave", end);
    cell.addEventListener("touchend", end);
    cell.addEventListener("touchcancel", end);

    cell.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  // ============================================================
  // Value menu
  // ============================================================
  function openValueMenu(cell, type) {
    const cc = cell.dataset.cc;
    if (!cc) {
      alert("Record này không có CC NUMBER.");
      return;
    }

    const isPriority = type === "priority";
    const fieldName = isPriority ? FIELD_PRIORITY : FIELD_CURRENT_STATUS;
    const options = isPriority ? PRIORITY_OPTIONS : STATUS_OPTIONS;
    const currentValue = cell.dataset.value || "";

    statusMenu.replaceChildren();

    const title = document.createElement("div");
    title.className = "menu-title";
    title.textContent = isPriority
      ? `CC ${cc} — chọn Priority`
      : `CC ${cc} — chọn Current Status`;
    statusMenu.appendChild(title);

    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opt;
      if (opt === currentValue) btn.classList.add("current");
      btn.addEventListener("click", () => {
        hideStatusMenu();
        applyValueChange(cell, cc, fieldName, opt, type);
      });
      statusMenu.appendChild(btn);
    });

    statusMenu.classList.add("show");
    statusMenu.style.left = "-9999px";
    statusMenu.style.top = "-9999px";

    const rect = cell.getBoundingClientRect();
    const menuRect = statusMenu.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const margin = 8;

    let left = rect.left;
    let top = rect.bottom + 6;

    if (left + menuRect.width + margin > vw) {
      left = Math.max(margin, vw - menuRect.width - margin);
    }
    if (top + menuRect.height + margin > vh) {
      top = Math.max(margin, rect.top - menuRect.height - 6);
    }
    statusMenu.style.left = `${left}px`;
    statusMenu.style.top = `${top}px`;

    setTimeout(() => {
      document.addEventListener("mousedown", onDocClickForMenu, true);
      document.addEventListener("touchstart", onDocClickForMenu, true);
    }, 0);
  }

  function onDocClickForMenu(evt) {
    if (!statusMenu.classList.contains("show")) return;
    if (statusMenu.contains(evt.target)) return;
    hideStatusMenu();
  }

  function hideStatusMenu() {
    statusMenu.classList.remove("show");
    document.removeEventListener("mousedown", onDocClickForMenu, true);
    document.removeEventListener("touchstart", onDocClickForMenu, true);
  }

  async function applyValueChange(cell, cc, fieldName, newValue, type) {
    const isPriority = type === "priority";

    const entry = getStatusEntry(cc);
    const prevValue = entry[fieldName] || "";
    const updated = { ...entry, [fieldName]: newValue };

    cell.classList.remove("empty");
    cell.classList.add("saving");
    cell.dataset.value = newValue;
    cell.replaceChildren();

    const badge = document.createElement("span");
    badge.className = isPriority ? "priority-badge" : "status-badge";
    if (isPriority) badge.dataset.priority = newValue;
    else badge.dataset.status = newValue;
    badge.textContent = newValue;
    cell.appendChild(badge);

    try {
      await saveStatusEntry(cc, updated, [fieldName]);
      cell.classList.remove("saving");
      cell.classList.add("saved");
      setTimeout(() => cell.classList.remove("saved"), 1500);

      if (detailChartsData) {
        detailChartsData = buildDetailChartsData(detailRecordsAll);
        renderDetailCharts();
        updateDetailChartsVisibility();
      }
    } catch (err) {
      if (err.isAuthError) return;
      console.error("saveStatusEntry failed:", err);
      cell.classList.remove("saving");
      cell.classList.add("error");
      cell.title = `Lỗi khi lưu: ${err.message}`;

      entry[fieldName] = prevValue;
      cell.dataset.value = prevValue;
      cell.replaceChildren();
      if (prevValue) {
        const oldBadge = document.createElement("span");
        oldBadge.className = isPriority ? "priority-badge" : "status-badge";
        if (isPriority) oldBadge.dataset.priority = prevValue;
        else oldBadge.dataset.status = prevValue;
        oldBadge.textContent = prevValue;
        cell.appendChild(oldBadge);
      } else {
        cell.classList.add("empty");
        cell.textContent = isPriority
          ? "— (long-press 5s to set priority)"
          : "— (long-press 5s to set status)";
      }

      alert(`Không lưu được giá trị. Vui lòng thử lại.\n${err.message}`);
      setTimeout(() => cell.classList.remove("error"), 3000);
    }
  }

  function selectDetailRow(tr) {
    if (selectedDetailRow === tr) {
      tr.classList.remove("selected");
      selectedDetailRow = null;
      return;
    }
    if (selectedDetailRow) selectedDetailRow.classList.remove("selected");
    tr.classList.add("selected");
    selectedDetailRow = tr;
  }

  // ============================================================
  // MODAL / BASIC TABLE
  // ============================================================
  tbody.addEventListener("click", (e) => {
    const td = e.target.closest(`td[data-label="${CONTENT_LABEL}"]`);
    if (!td) return;
    toggleContentModal(td);
  });

  modalClose.addEventListener("click", closeContentModal);

  contentModal.addEventListener("click", (e) => {
    if (e.target === contentModal) closeContentModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (contentModal.classList.contains("show")) closeContentModal();
      hideStatusMenu();
    }
  });

  function toggleContentModal(td) {
    if (openContentCell === td) {
      closeContentModal();
      return;
    }
    const valueEl = td.querySelector(".cell-value");
    const fullText = (valueEl ? valueEl.textContent : td.textContent) || "(empty)";
    modalTitle.textContent = "Communication Content";
    modalBody.textContent = fullText;
    contentModal.classList.add("show");
    openContentCell = td;
  }

  function closeContentModal() {
    contentModal.classList.remove("show");
    openContentCell = null;
  }

  function debounce(fn, delay) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  function applyFilters() {
    const activeList = filters.customerGroup
      ? customerListCache[filters.customerGroup]
      : null;

    filteredData = allData.filter(item =>
      (filters.cc === "" || item[FIELD_MAP.cc.key].includes(filters.cc)) &&
      (filters.topic === "" || item[FIELD_MAP.topic.key].includes(filters.topic)) &&
      (filters.content === "" || item[FIELD_MAP.content.key].includes(filters.content)) &&
      (!filters.newOnly || item[FIELD_MAP.cc.key].includes(NEW_KEYWORD)) &&
      (!activeList || activeList.has(item.__customer))
    );

    currentPage = 1;
    renderTable();
  }

  function renderTable() {
    closeContentModal();

    const start = (currentPage - 1) * ROWS_PER_PAGE;
    const pageData = filteredData.slice(start, start + ROWS_PER_PAGE);
    const fragment = document.createDocumentFragment();

    if (pageData.length === 0) {
      const tr = document.createElement("tr");
      tr.className = "empty-row";
      const td = document.createElement("td");
      td.colSpan = COLUMNS.length + 1;
      td.textContent = "No matching records.";
      tr.appendChild(td);
      fragment.appendChild(tr);
    } else {
      for (const item of pageData) {
        fragment.appendChild(buildRow(item));
      }
    }

    tbody.replaceChildren(fragment);
    renderPagination();
    requestAnimationFrame(adjustRowHeights);
  }

  function buildRow(item) {
    const tr = document.createElement("tr");

    for (const col of COLUMNS) {
      const td = document.createElement("td");
      td.dataset.label = col.label;

      const value = document.createElement("span");
      value.className = "cell-value";
      value.textContent = item[col.field] ?? "";
      td.appendChild(value);

      tr.appendChild(td);
    }

    const actionTd = document.createElement("td");
    actionTd.dataset.label = "ACTION";
    const link = document.createElement("a");
    link.className = "action-btn";
    link.href = item["GO TO WEB"] || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open";
    actionTd.appendChild(link);
    tr.appendChild(actionTd);

    return tr;
  }

  function adjustRowHeights() {
    const rows = tbody.querySelectorAll("tr:not(.empty-row)");
    const jobs = [];

    rows.forEach(tr => {
      const topicValue = tr.querySelector('td[data-label="TOPIC"] .cell-value');
      if (!topicValue) return;

      const lineHeight = parseFloat(getComputedStyle(topicValue).lineHeight) || 16;
      const maxLines = Math.max(1, Math.round(topicValue.offsetHeight / lineHeight));
      jobs.push({ tr, maxLines });
    });

    jobs.forEach(({ tr, maxLines }) => {
      tr.querySelectorAll(
        'td:not([data-label="TOPIC"]):not([data-label="ACTION"]) .cell-value'
      ).forEach(span => {
        span.style.setProperty("--clamp-lines", maxLines);
        span.classList.add("clamp");
      });
    });
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(filteredData.length / ROWS_PER_PAGE));
    pagination.replaceChildren();

    if (filteredData.length <= ROWS_PER_PAGE) {
      const strong = document.createElement("strong");
      strong.textContent = `Total: ${filteredData.length} records`;
      pagination.appendChild(strong);
      return;
    }

    const prev = document.createElement("button");
    prev.textContent = "Prev";
    prev.disabled = currentPage === 1;
    prev.onclick = () => { currentPage--; renderTable(); };

    const info = document.createElement("strong");
    info.textContent = `Page ${currentPage} / ${totalPages}  |  Total ${filteredData.length} records`;

    const next = document.createElement("button");
    next.textContent = "Next";
    next.disabled = currentPage === totalPages;
    next.onclick = () => { currentPage++; renderTable(); };

    pagination.append(prev, info, next);
  }
})();
</script>
