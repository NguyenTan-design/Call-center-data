<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="customer-service.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Management</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #1e3a5f;
    --border: #334155;
    --border-strong: #475569;
    --row-alt: #0f172a;
    --row-hover: #334155;
    --cell-line-height: 1.4;
    --status-closed: #43a047;
    --status-ongoing: #fb8c00;
    --text: #e2e8f0;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --danger: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    max-width: 100vw;
    overflow-x: hidden; /* Chống tràn màn hình ngang */
  }

  body {
    padding: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  /* ============================================================
     Sticky header
     ============================================================ */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 15px;
    padding: 12px 16px;
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .04);
  }

  .sticky-header h1 {
    margin: 0;
    color: #e2e8f0;
    font-size: 22px;
    font-weight: 700;
    text-align: left;
    flex: 1 1 auto;
    letter-spacing: -.3px;
  }

  .sticky-header .mode-btn { flex: 0 0 auto; }

  /* ============================================================
     Toolbar
     ============================================================ */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  .toolbar input[type="text"] {
    flex: 1 1 200px;
    padding: 10px 14px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #1e293b;
    color: var(--text);
    transition: border-color .18s ease, box-shadow .18s ease;
  }

  .toolbar input[type="text"]::placeholder { color: #94a3b8; }

  .toolbar input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }

  .toggle-btn {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--primary);
    border-radius: 8px;
    background: #1e293b;
    color: #93c5fd;
    cursor: pointer;
    transition: all .18s ease;
  }

  .toggle-btn:hover {
    background: var(--primary-soft);
    border-color: var(--primary-dark);
  }

  .toggle-btn.active {
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-color: var(--primary-dark);
    color: #fff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, .28);
  }

  #clear-filters {
    flex: 0 0 auto;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #1e293b;
    color: var(--text-soft);
    cursor: pointer;
    transition: all .18s ease;
  }
  #clear-filters:hover {
    background: #334155;
    border-color: var(--border-strong);
  }

  #status {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 8px;
    text-align: center;
  }

  /* ============================================================
     Table wrapper & table
     ============================================================ */
  .table-wrapper {
    background: #1e293b;
    border-radius: 12px;
    overflow: auto;
    height: calc(100vh - 190px);
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    z-index: 10;
    font-weight: 600;
    letter-spacing: .2px;
  }

  th, td {
    border: 1px solid var(--border);
    padding: 9px 10px;
    font-size: 13px;
    vertical-align: top;
    color: var(--text);
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); transition: background .12s ease; }

  /* ============================================================
     Bảng Basic (load từ data.json)
     ============================================================ */
  #basic-view table { width: 100%; }

  #basic-view th:nth-child(1), #basic-view td:nth-child(1) { width: 10%; }
  #basic-view th:nth-child(2), #basic-view td:nth-child(2) { width: 10%; color: var(--danger); font-weight: 700; }
  #basic-view th:nth-child(3), #basic-view td:nth-child(3) { width: 15%; }
  #basic-view th:nth-child(4), #basic-view td:nth-child(4) { width: 20%; }
  #basic-view th:nth-child(5), #basic-view td:nth-child(5) { width: 25%; }
  #basic-view th:nth-child(6), #basic-view td:nth-child(6) { width: 10%; }
  #basic-view th:nth-child(7), #basic-view td:nth-child(7) { width: 10%; text-align: center; }

  /* ============================================================
     Header column hide/show toggle button (Detail)
     ============================================================ */
  #detail-view thead th {
    overflow: hidden;
    padding-right: 22px;
  }

  .col-hide-btn {
    position: absolute;
    top: 3px;
    right: 4px;
    width: 16px;
    height: 16px;
    line-height: 14px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 50%;
    cursor: pointer;
    opacity: .45;
    padding: 0;
    transition: opacity .15s ease, background .15s ease, transform .15s ease;
    z-index: 20;
  }
  .col-hide-btn:hover { opacity: 1; background: rgba(255, 255, 255, .35); transform: scale(1.08); }

  .hidden-cols-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 10px;
    padding: 8px 10px;
    background: #422006;
    border: 1px solid #78350f;
    border-radius: 8px;
    min-height: 0;
  }

  .hidden-cols-toolbar:empty { display: none; }

  .hidden-cols-toolbar::before {
    content: "Ẩn:";
    font-size: 11.5px;
    color: #fcd34d;
    font-weight: 700;
    margin-right: 4px;
    align-self: center;
  }

  .col-show-btn {
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 700;
    color: #fcd34d;
    background: #422006;
    border: 1px solid #a16207;
    border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .col-show-btn:hover { background: #78350f; border-color: #ca8a04; }

  .cell-value {
    display: block;
    width: 100%;
    line-height: var(--cell-line-height);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  td[data-label="TOPIC"] .cell-value {
    white-space: normal;
    overflow-wrap: break-word;
    text-overflow: clip;
  }

  .cell-value.clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    line-clamp: var(--clamp-lines, 3);
    -webkit-line-clamp: var(--clamp-lines, 3);
    white-space: normal;
    overflow-wrap: break-word;
  }

  td[data-label="COMMUNICATION CONTENT"] { cursor: pointer; }
  td[data-label="COMMUNICATION CONTENT"]:hover { background: #1e3a5f; }

  .action-btn {
    display: inline-block;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(37, 99, 235, .25);
    transition: all .18s ease;
  }
  .action-btn:hover {
    background: linear-gradient(180deg, var(--primary-dark) 0%, #1e40af 100%);
    box-shadow: 0 3px 8px rgba(37, 99, 235, .35);
    transform: translateY(-1px);
  }

  .empty-row td {
    text-align: center;
    color: #94a3b8;
    padding: 24px;
  }

  /* ============================================================
     Pagination
     ============================================================ */
  #pagination {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  #pagination button {
    padding: 6px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #1e293b;
    color: var(--text-soft);
    font-weight: 500;
    transition: all .15s ease;
  }
  #pagination button:hover:not(:disabled) {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
  }
  #pagination button:disabled { cursor: not-allowed; opacity: .45; }
  #pagination strong { color: var(--text-soft); font-size: 13px; }

  /* ============================================================
     Modal
     ============================================================ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn .18s ease;
  }
  .modal-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .modal-box {
    background: #1e293b;
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(15, 23, 42, .35), 0 4px 12px rgba(15, 23, 42, .2);
    animation: slideUp .22s cubic-bezier(.16,1,.3,1);
    overflow: hidden;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
  }
  .modal-header h2 { margin: 0; font-size: 16px; font-weight: 600; }

  .modal-close {
    background: rgba(255, 255, 255, .15);
    border: none;
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 10px;
    border-radius: 6px;
    transition: background .15s ease;
  }
  .modal-close:hover { background: rgba(255, 255, 255, .3); }

  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere; /* Fix: Ngắt dòng kể cả khi không có khoảng trắng */
    word-break: break-word;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }

  /* ============================================================
     Mode / Back buttons
     ============================================================ */
  .mode-btn {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #2e7d32;
    border-radius: 8px;
    background: linear-gradient(180deg, #43a047 0%, #2e7d32 100%);
    color: #fff;
    cursor: pointer;
    transition: all .18s ease;
    box-shadow: 0 1px 3px rgba(46, 125, 50, .25);
  }
  .mode-btn:hover {
    background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
    box-shadow: 0 3px 8px rgba(46, 125, 50, .35);
  }

  .back-btn {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: #1e293b;
    color: var(--text-soft);
    cursor: pointer;
    transition: all .18s ease;
  }
  .back-btn:hover { background: #334155; border-color: #94a3b8; }

  /* ============================================================
     Graph view
     ============================================================ */
  #graph-view { display: none; }

  #graph-status {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 8px;
    text-align: center;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .chart-card {
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .05);
    padding: 16px;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .chart-card:hover {
    box-shadow: 0 4px 20px rgba(15, 23, 42, .1), 0 8px 24px rgba(15, 23, 42, .06);
  }
  .chart-card-wide { grid-column: 1 / -1; }

  .chart-card h3 {
    margin: 0 0 12px;
    text-align: center;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.1px;
  }

  .chart-empty {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    padding: 24px 0;
  }

  .chart-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .chart-svg-wrap svg { display: block; }

  .chart-svg-wrap circle.pie-slice {
    cursor: pointer;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1),
                filter .3s ease;
  }
  .chart-svg-wrap circle.pie-slice:hover {
    filter: drop-shadow(0 3px 5px rgba(15, 23, 42, .3));
  }
  .chart-svg-wrap circle.pie-slice.active {
    filter: drop-shadow(0 10px 14px rgba(15, 23, 42, .45))
            drop-shadow(0 2px 4px rgba(15, 23, 42, .3));
  }

  .slice-tooltip {
    position: fixed;
    transform: translate(-50%, -100%);
    background: #0f172a;
    color: #fff;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 8px 20px rgba(15, 23, 42, .4);
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: opacity .15s ease;
  }
  .slice-tooltip.show { opacity: 1; visibility: visible; }

  .slice-tooltip .tooltip-title {
    display: block;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .chart-legend {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 320px;
  }
  .chart-legend li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12.5px;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .chart-legend li:hover { background: var(--primary-soft); }

  .legend-dot {
    flex: 0 0 auto;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }

  .legend-label {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-value {
    flex: 0 0 auto;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .bar-chart-list {
    max-height: 460px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 160px 1fr 34px;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 12.5px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 6px;
    transition: background .15s ease;
  }
  .bar-row:hover { background: var(--primary-soft); }

  .bar-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .bar-track {
    position: relative;
    display: block;
    height: 14px;
    background: #334155;
    border-radius: 7px;
    overflow: hidden;
  }

  .bar-fill {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 7px;
    transition: width .4s cubic-bezier(.16,1,.3,1);
  }

  .bar-value {
    text-align: right;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .na-rank-list {
    max-height: 520px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .na-rank-row {
    padding: 8px 8px 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid #f1f5f9;
    border-radius: 8px;
    transition: background .15s ease;
  }
  .na-rank-row:hover { background: #1e3a5f; }

  .na-rank-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .na-rank-bars {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .na-rank-bar {
    display: grid;
    grid-template-columns: 56px 1fr 40px;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background .12s ease;
  }
  .na-rank-bar:hover { background: var(--primary-soft); }

  .na-rank-bar-tag {
    color: var(--text-muted);
    text-align: right;
    white-space: nowrap;
  }

  .na-rank-track {
    position: relative;
    display: block;
    height: 12px;
    background: #334155;
    border-radius: 6px;
    overflow: hidden;
  }

  .na-rank-fill {
    display: block;
    height: 100%;
    border-radius: 6px;
    transition: width .4s cubic-bezier(.16,1,.3,1);
  }
  .na-rank-fill.total { background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%); }
  .na-rank-fill.closed { background: linear-gradient(90deg, #66bb6a 0%, #43a047 100%); }
  .na-rank-fill.ongoing { background: linear-gradient(90deg, #ffa726 0%, #fb8c00 100%); }

  .na-rank-value {
    text-align: right;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .na-rank-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-soft);
  }
  .na-rank-legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .na-rank-legend .dot {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    display: inline-block;
  }

  /* ============================================================
     Detail view
     ============================================================ */
  #detail-view { display: none; }

  #detail-view .detail-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  #detail-view .detail-info {
    font-size: 14px;
    color: var(--text);
  }
  #detail-view .detail-info strong { color: #93c5fd; }

  #detail-view .detail-count {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-left: 8px;
  }

  #detail-view .detail-search {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  #detail-view .detail-search input[type="text"] {
    flex: 1 1 220px;
    padding: 9px 12px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #1e293b;
    color: var(--text);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  #detail-view .detail-search input[type="text"]::placeholder { color: #94a3b8; }
  #detail-view .detail-search input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }

  #detail-view .table-wrapper {
    height: calc(100vh - 270px);
  }

  #detail-view table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  #detail-view th,
  #detail-view td {
    font-size: 12.5px;
    white-space: normal;
    overflow: hidden;
    text-overflow: ellipsis;
    overflow-wrap: break-word;
    word-break: break-word;
    padding: 6px 8px;
    vertical-align: top;
  }

  #detail-view th {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    z-index: 10;
    white-space: nowrap;
    padding-right: 22px;
    font-weight: 600;
  }

  /* TOPIC */
  #detail-view th[data-col-type="topic"],
  #detail-view td[data-col-type="topic"] {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    overflow-wrap: break-word;
    word-break: break-word;
    vertical-align: top;
  }

  /* GO TO WEB */
  #detail-view th[data-col-type="link"],
  #detail-view td[data-col-type="link"] {
    text-align: center;
    padding: 4px;
  }

  /* Current Status */
  #detail-view th[data-col-type="status"],
  #detail-view td[data-col-type="status"] {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    vertical-align: middle;
    text-align: left;
  }

  /* Priority */
  #detail-view th[data-col-type="priority"],
  #detail-view td[data-col-type="priority"] {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    vertical-align: middle;
    text-align: left;
  }

  /* Open day */
  #detail-view th[data-col-type="openday"],
  #detail-view td[data-col-type="openday"] {
    text-align: center;
    vertical-align: middle;
    white-space: normal !important;
  }

  /* CC NUMBER: sticky left + chữ đỏ */
  #detail-view th[data-col-type="ccnumber"],
  #detail-view td[data-col-type="ccnumber"] {
    position: sticky;
    left: 0;
    color: var(--danger);
    font-weight: 700;
    background: #1e293b;
    z-index: 5;
    box-shadow: 2px 0 3px -1px rgba(15, 23, 42, .12);
    white-space: nowrap !important;
    text-overflow: clip !important;
    overflow: visible !important;
  }
  #detail-view th[data-col-type="ccnumber"] {
    z-index: 15;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding-right: 8px;
  }
  #detail-view tbody tr:hover td[data-col-type="ccnumber"] {
    background: var(--row-hover);
  }
  #detail-view tbody tr:nth-child(even) td[data-col-type="ccnumber"] {
    background: var(--row-alt);
  }

  #detail-view tbody tr.detail-row {
    cursor: pointer;
    transition: background .15s ease;
  }
  #detail-view tbody tr.detail-row.selected {
    background: #1e3a5f !important;
    box-shadow: inset 4px 0 0 var(--primary);
  }
  #detail-view tbody tr.detail-row.selected td { color: #e2e8f0; }

  #detail-view .detail-link-btn {
    display: inline-block;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);

    text-decoration: none;
    padding: 4px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(37, 99, 235, .25);

  }
  #detail-view .detail-link-btn:hover {
    box-shadow: 0 3px 8px rgba(37, 99, 235, .35);
    transform: translateY(-1px);
  }

  /* ============================================================
     Cột ẩn
     ============================================================ */
  #detail-view th.col-hidden,
  #detail-view td.col-hidden {
    display: none !important;
  }

  /* ============================================================
     Detail charts
     ============================================================ */
  #detail-charts {
    display: none;
    margin-bottom: 15px;
    width: 100%;
  }
  #detail-charts.show { display: block; }

  #detail-charts .detail-charts-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }

  #detail-charts .chart-card {
    padding: 10px;
    width: 100%;
    min-width: 0;
  }

  #detail-charts .chart-card h3 {
    font-size: 13.5px;
    margin-bottom: 8px;
  }

  #detail-charts .chart-svg-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #detail-charts .chart-svg-wrap svg {
    width: 100%;
    max-width: 140px;
    height: auto;
    aspect-ratio: 1 / 1;
  }

  #detail-charts .chart-body { width: 100%; }

  #detail-charts .chart-legend {
    max-width: 100%;
    width: 100%;
  }

  #detail-charts .chart-legend li {
    font-size: 10.5px;
    padding: 2px 4px;
  }

  #toggle-detail-charts {
    display: none;
    flex: 0 0 auto;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #2e7d32;
    border-radius: 8px;
    background: linear-gradient(180deg, #43a047 0%, #2e7d32 100%);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(46, 125, 50, .25);
    transition: all .18s ease;
  }
  #toggle-detail-charts:hover {
    background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
  }
  #toggle-detail-charts.visible { display: inline-block; }

  /* ============================================================
     Status cell
     ============================================================ */
  .status-cell {
    position: relative;
    display: block;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px dashed transparent;
    transition: background .2s ease, border-color .2s ease;
    min-height: 20px;
    font-size: 12px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-cell:hover {
    background: var(--primary-soft);
    border-color: #3b82f6;
  }

  .status-cell.hold-progress {
    background: linear-gradient(
      to right,
      #1e40af 0%,
      #1e40af var(--hold-progress, 0%),
      transparent var(--hold-progress, 0%),
      transparent 100%
    );
    border-color: var(--primary);
  }

  .status-cell.empty { color: #94a3b8; font-style: italic; }

  .status-cell.saving {
    background: #422006;
    border-color: #ca8a04;
  }

  .status-cell.saved {
    background: #14532d;
    border-color: #22c55e;
  }

  .status-cell.error {
    background: #450a0a;
    border-color: #dc2626;
    color: #fca5a5;
  }

  .status-cell.readonly {
    cursor: default;
    background: #0f172a;
    border-color: #334155;
    color: var(--text);
    font-weight: 700;
    text-align: center;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: normal;
    color: #fff;
    background: #64748b;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
    letter-spacing: .2px;
  }
  .status-badge[data-status="New case"]                  { background: #2563eb; }
  .status-badge[data-status="FUJI JP Investigating"]     { background: #9333ea; }
  .status-badge[data-status="On Going"]                  { background: #f97316; }
  .status-badge[data-status="Waiting for FMV Action"]    { background: #0d9488; }
  .status-badge[data-status="Under Consideration"]       { background: #4f46e5; }
  .status-badge[data-status="Pending"]                   { background: #64748b; }

  .priority-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: normal;
    color: #fff;
    background: #64748b;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
    letter-spacing: .2px;
  }
  .priority-badge[data-priority^="S:"] { background: #dc2626; }
  .priority-badge[data-priority^="A:"] { background: #ea580c; }
  .priority-badge[data-priority^="B:"] { background: #eab308; color: #1f2937; }
  .priority-badge[data-priority^="C:"] { background: #16a34a; }
  .priority-badge[data-priority^="D:"] { background: #64748b; }

  /* ============================================================
     Status menu
     ============================================================ */
  .status-menu {
    position: fixed;
    z-index: 1500;
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .22), 0 4px 12px rgba(15, 23, 42, .12);
    padding: 6px;
    min-width: 260px;
    max-width: 380px;
    max-height: 70vh;
    overflow-y: auto;
    display: none;
    animation: slideUp .15s ease;
  }
  .status-menu.show { display: block; }

  .status-menu .menu-title {
    font-size: 11.5px;
    color: var(--text-muted);
    padding: 6px 10px 8px;
    border-bottom: 1px solid #eef2f7;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
  }

  .status-menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 9px 12px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    color: var(--text);
    white-space: normal;
    line-height: 1.35;
    transition: background .12s ease;
  }
  .status-menu button:hover { background: var(--primary-soft); }
  .status-menu button.current {
    background: #1e3a5f;
    font-weight: 700;
    color: #93c5fd;
  }

  /* ============================================================
     AUTH / LOGIN
     ============================================================ */
  body:not(.authenticated) .sticky-header,
  body:not(.authenticated) #basic-view,
  body:not(.authenticated) #graph-view,
  body:not(.authenticated) #detail-view,
  body:not(.authenticated) #slice-tooltip,
  body:not(.authenticated) #status-menu,
  body:not(.authenticated) #content-modal {
    display: none !important;
  }

  .login-screen {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.1) 0%, transparent 50%),
      linear-gradient(135deg, #1e40af 0%, #1d4ed8 45%, #0f172a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5000;
    padding: 20px;
  }
  .login-screen.hidden { display: none; }

  .login-box {
    background: #1e293b;
    border-radius: 14px;
    padding: 34px 30px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .5), 0 8px 20px rgba(15, 23, 42, .3);
    animation: slideUp .3s cubic-bezier(.16,1,.3,1);
  }
  .login-box h2 {
    margin: 0 0 24px;
    text-align: center;
    color: #93c5fd;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .login-box label {
    display: block;
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    background: #0f172a;
    color: var(--text);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .login-box input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }
  .login-box button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .35);
    transition: all .18s ease;
  }
  .login-box button[type="submit"]:hover {
    background: linear-gradient(180deg, var(--primary-dark) 0%, #1e40af 100%);
    box-shadow: 0 6px 18px rgba(37, 99, 235, .45);
    transform: translateY(-1px);
  }
  .login-box button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .login-error {
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin: 10px 0 0;
    line-height: 1.3;
    font-weight: 500;
  }

  .logout-btn {
    flex: 0 0 auto;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--danger);
    border-radius: 8px;
    background: #1e293b;
    color: var(--danger);
    cursor: pointer;
    transition: all .18s ease;
  }
  .logout-btn:hover {
    background: #450a0a;
    box-shadow: 0 2px 8px rgba(220, 38, 38, .18);
  }

  /* ============================================================
     Scrollbar tinh tế
     ============================================================ */
  .table-wrapper::-webkit-scrollbar,
  .bar-chart-list::-webkit-scrollbar,
  .na-rank-list::-webkit-scrollbar,
  .status-menu::-webkit-scrollbar,
  .modal-body::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .table-wrapper::-webkit-scrollbar-thumb,
  .bar-chart-list::-webkit-scrollbar-thumb,
  .na-rank-list::-webkit-scrollbar-thumb,
  .status-menu::-webkit-scrollbar-thumb,
  .modal-body::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  .table-wrapper::-webkit-scrollbar-thumb:hover,
  .bar-chart-list::-webkit-scrollbar-thumb:hover,
  .na-rank-list::-webkit-scrollbar-thumb:hover,
  .status-menu::-webkit-scrollbar-thumb:hover,
  .modal-body::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  .table-wrapper::-webkit-scrollbar-track,
  .bar-chart-list::-webkit-scrollbar-track,
  .na-rank-list::-webkit-scrollbar-track,
  .status-menu::-webkit-scrollbar-track,
  .modal-body::-webkit-scrollbar-track {
    background: transparent;
  }

  /* ============================================================
     Responsive
     ============================================================ */
  @media (max-width: 768px) {
    body { padding: 8px; }

    .sticky-header {
      flex-wrap: wrap; /* Cho phép xuống dòng khi không đủ chỗ */
      justify-content: center;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      gap: 8px;
    }
    .sticky-header h1 { 
      flex: 1 1 100%;
      text-align: center;
      font-size: 18px; 
      margin-bottom: 4px;
    }
    .sticky-header .mode-btn,
    .sticky-header .logout-btn {
      flex: 1 1 40%; /* Chia đều nút trên mobile */
      font-size: 13px;
      padding: 8px 10px;
      text-align: center;
    }

    .toolbar { gap: 8px; }
    .toolbar input[type="text"] { flex: 1 1 100%; font-size: 13px; padding: 9px 12px; }
    .toggle-btn, #clear-filters { flex: 1 1 auto; text-align: center; padding: 9px 10px; font-size: 13px; }

    #pagination { flex-wrap: wrap; justify-content: space-between; }
    #pagination strong { flex: 1 1 100%; order: 2; text-align: center; font-size: 12px; }

    .table-wrapper {
      height: auto;
      max-height: calc(100vh - 300px);
      box-shadow: none;
      background: transparent;
      border: none;
    }

    table { table-layout: fixed; }
    th, td { font-size: 9px; padding: 3px; }
    th { font-size: 10px; }

    /* Fix lỗi Popup tràn màn hình trên điện thoại */
    .modal-overlay { padding: 10px; }
    .modal-box { 
      max-height: 90vh; 
      width: 100%; 
      max-width: 100%;
    }
    .modal-body {
      padding: 12px;
      overflow-wrap: anywhere; 
      word-break: break-word;
    }

    .charts-grid { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 100px 1fr 30px; font-size: 11px; }

    .na-rank-bar { grid-template-columns: 48px 1fr 34px; font-size: 10.5px; }

    #detail-view th, #detail-view td { font-size: 10px; padding: 3px; }
    .status-cell { font-size: 10.5px; }

    #detail-view .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #basic-view .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #basic-view table { width: 100%; min-width: 0; table-layout: fixed; }
    #basic-view th, #basic-view td { padding: 2px; overflow: hidden; }
    #basic-view th {
      font-size: 8px;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.15;
    }
    #basic-view td { overflow-wrap: anywhere; }
    #basic-view td[data-label="TOPIC"] .cell-value {
      max-width: none;
      width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    #basic-view .cell-value { overflow-wrap: anywhere; }
    #basic-view .action-btn { padding: 3px 2px; font-size: 8px; max-width: 100%; box-sizing: border-box; }

    #detail-charts {
      width: 100%;
      margin-left: 0;
      margin-right: 0;
    }
    #detail-charts .detail-charts-grid {
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
    }
    #detail-charts .chart-card {
      width: 100%;
      padding: 10px;
    }
    #detail-charts .chart-svg-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #detail-charts .chart-svg-wrap svg {
      width: 33%;
      max-width: 33%;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    #detail-charts .chart-legend { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="sticky-header">
  <h1 id="page-title">NA TEAM CC Management</h1>
  <button id="graph-mode-btn" class="mode-btn" type="button">📊 Graph mode</button>
  <button id="basic-mode-btn" class="mode-btn" type="button" style="display:none">⬅ Basic mode</button>
  <button id="logout-btn" class="logout-btn" type="button" title="Đăng xuất">Logout</button>
</div>

<div id="basic-view">
  <div class="toolbar">
    <input id="search-cc" type="text" placeholder="Search CC Number">
    <input id="search-topic" type="text" placeholder="Search Topic">
    <input id="search-content" type="text" placeholder="Search Communication Content">
    <button id="filter-new" class="toggle-btn" type="button" aria-pressed="false">NEW only</button>
    <button id="filter-nat" class="toggle-btn" type="button" aria-pressed="false">NAT</button>
    <button id="filter-other" class="toggle-btn" type="button" aria-pressed="false">OTHER</button>
    <button id="clear-filters" type="button">Clear</button>
  </div>

  <p id="status">Loading data...</p>

  <div id="pagination"></div>

  <div class="table-wrapper">
    <table id="basic-table">
      <thead>
        <tr id="basic-thead-row">
          <th>DATE</th>
          <th>CC NUMBER</th>
          <th>CUSTOMER</th>
          <th>TOPIC</th>
          <th>COMMUNICATION CONTENT</th>
          <th>FMV PIC</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="graph-view">
  <p id="graph-status">Loading graph data...</p>

  <div class="charts-grid">
    <div class="chart-card" id="chart-open-close"></div>
    <div class="chart-card" id="chart-na-rank"></div>
    <div class="chart-card" id="chart-na-inquiry"></div>
    <div class="chart-card" id="chart-fmv-inquiry"></div>
    <div class="chart-card chart-card-wide" id="chart-fmv-rank"></div>
  </div>
</div>

<div id="detail-view">
  <div class="detail-toolbar">
    <div class="detail-info">
      <span id="detail-title">Detail</span>
      <span id="detail-count" class="detail-count"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="toggle-detail-charts" type="button">📊 Show graph</button>
      <button id="detail-back-btn" class="back-btn" type="button">⬅ BACK</button>
    </div>
  </div>

  <div id="detail-charts">
    <div class="detail-charts-grid">
      <div class="chart-card" id="detail-chart-site"></div>
      <div class="chart-card" id="detail-chart-inquiry"></div>
      <div class="chart-card" id="detail-chart-status"></div>
      <div class="chart-card" id="detail-chart-priority"></div>
    </div>
  </div>

  <div class="detail-search">
    <input id="detail-search-cc" type="text" placeholder="Search CC Number">
    <input id="detail-search-topic" type="text" placeholder="Search Topic">
  </div>

  <div id="hidden-cols-detail" class="hidden-cols-toolbar"></div>

  <div class="table-wrapper">
    <table id="detail-table">
      <colgroup id="detail-colgroup"></colgroup>
      <thead id="detail-thead"></thead>
      <tbody id="detail-tbody"></tbody>
    </table>
  </div>
</div>

<div id="slice-tooltip" class="slice-tooltip"></div>

<div id="status-menu" class="status-menu" role="menu" aria-label="Select value"></div>

<div id="content-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-title">Communication Content</h2>
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-box" autocomplete="on">
    <h2>🔒 Đăng Nhập</h2>
    <label for="login-username">Tài khoản</label>
    <input id="login-username" name="username" type="text" autocomplete="username" required>
    <label for="login-password">Mật khẩu</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    <button id="login-submit" type="submit">Đăng Nhập</button>
    <p id="login-error" class="login-error"></p>
  </form>
</div>

<script>
(() => {
  "use strict";

  const ROWS_PER_PAGE = 50;
  const SEARCH_DEBOUNCE_MS = 200;
  const RESIZE_DEBOUNCE_MS = 150;
  const NEW_KEYWORD = "new";
  const CONTENT_LABEL = "COMMUNICATION CONTENT";
  const SLICE_RESET_MS = 3000;
  const HOLD_MS = 5000;

  const STATUS_COL_NAME   = "Current Status";
  const PRIORITY_COL_NAME = "Priority";
  const OPENDAY_COL_NAME  = "Open day";

  const FIELD_CURRENT_STATUS = "Current status";
  const FIELD_PRIORITY       = "Priority";
  const FIELD_OPEN_DAY       = "Open day";

  const STATUS_OPTIONS = [
    "New case",
    "FUJI JP Investigating",
    "On Going",
    "Waiting for FMV Action",
    "Under Consideration",
    "Pending"
  ];

  const PRIORITY_OPTIONS = [
    "S:Machine Stop",
    "A:Sometimes Stop/Customer focus on the issue",
    "B:Need to Fix ASAP",
    "C:Need to make schedule",
    "D:Not Urgent"
  ];

  const TITLE_BASIC  = "NA TEAM CC Management";

  function storeToken(t) {
    try { sessionStorage.setItem(AUTH_TOKEN_KEY, t); } catch (_) {}
  }
  function clearStoredToken() {
    try { sessionStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
  }

  async function authFetch(url, options = {}) {
    const opts = { ...options, headers: { ...(options.headers || {}) } };
    if (authToken) opts.headers["Authorization"] = `Bearer ${authToken}`;
    const res = await fetch(url, opts);
    if (res.status === 401) {
      handleAuthFailure();
      const err = new Error("Phiên đăng nhập đã hết hạn.");
      err.isAuthError = true;
      throw err;
    }
    return res;
  }

  function handleAuthFailure() {
    if (authFailureHandled) return;
    authFailureHandled = true;
    authToken = "";
    clearStoredToken();
    alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
    location.reload();
  }

  function showLoginScreen() {
    document.body.classList.remove("authenticated");
    loginScreen.classList.remove("hidden");
    setTimeout(() => {
      loginPassword.value = "";
      loginUsername.focus();
    }, 50);
  }

  function hideLoginScreen() {
    loginScreen.classList.add("hidden");
    document.body.classList.add("authenticated");
  }

  function showLoginError(msg) {
    loginError.textContent = msg || "";
  }

  async function attemptLogin(username, password) {
    const res = await fetch(`${STATUS_API_BASE}/login`, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) {
      throw new Error(data.message || data.error || `Đăng nhập thất bại (HTTP ${res.status})`);
    }
    authToken = data.token;
    authFailureHandled = false;
    storeToken(authToken);
    return data;
  }

  async function verifyExistingToken() {
    if (!authToken) return false;
    try {
      const res = await fetch(`${STATUS_API_BASE}/me`, {
        method: "GET",
        mode: "cors",
        headers: { "Authorization": `Bearer ${authToken}`, "Accept": "application/json" }
      });
      return res.ok;
    } catch (_) {
      return false;
    }
  }

  async function bootstrap() {
    if (authToken) {
      const ok = await verifyExistingToken();
      if (ok) {
        hideLoginScreen();
        await init();
        return;
      }
      authToken = "";
      clearStoredToken();
    }
    showLoginScreen();
  }

  loginForm.addEventListener("submit", async (e) => {

      return;
    }
    showLoginError("");
    loginSubmit.disabled = true;
    loginSubmit.textContent = "Đang đăng nhập...";
    try {
      await attemptLogin(username, password);
      hideLoginScreen();
      await init();
    } catch (err) {
      console.error("Login failed:", err);
      showLoginError(err.message || "Đăng nhập thất bại.");
      loginPassword.value = "";

  function showColumn(idx, onChange) {
    delete hiddenColumns.detail[idx];

  function applyHiddenColumns() {
    const table = detailTable;
    if (!table) return;

    const hidden = hiddenColumns.detail;
    const headRow = table.querySelector("thead tr:first-child");
    const headCells = headRow ? headRow.children : [];
    const totalCols = headCells.length;

    for (let i = 0; i < totalCols; i++) {
      headCells[i].classList.toggle("col-hidden", !!hidden[i]);
    }

    const bodyRows = detailTbody.children;
    for (let r = 0; r < bodyRows.length; r++) {
      const cells = bodyRows[r].children;
      const n = Math.min(totalCols, cells.length);
      for (let i = 0; i < n; i++) {
        cells[i].classList.toggle("col-hidden", !!hidden[i]);
      }
    }

    updateColgroup();
    updateTableWidth();
  }

  function updateColgroup() {
    if (!detailColgroup) return;
    detailColgroup.replaceChildren();

    const hidden = hiddenColumns.detail;
    detailColTypes.forEach((type, idx) => {
      const col = document.createElement("col");
      if (hidden[idx]) {
        col.style.setProperty("display", "none", "important");
      } else {
        const w = DETAIL_COL_WIDTHS[type] || 120;
        col.style.setProperty("width", `${w}px`, "important");
        col.style.setProperty("min-width", `${w}px`, "important");
        col.style.setProperty("max-width", `${w}px`, "important");
      }
      detailColgroup.appendChild(col);
    });
  }

  function updateTableWidth() {
    const table = detailTable;
    if (!table) return;
    const hidden = hiddenColumns.detail;
    const hasHidden = Object.keys(hidden).some(k => hidden[k]);

    if (!hasHidden) {
      table.style.removeProperty("width");
      table.style.removeProperty("min-width");
      table.style.removeProperty("max-width");
      return;
    }

    let total = 0;
    detailColTypes.forEach((type, idx) => {
      if (hidden[idx]) return;
      total += DETAIL_COL_WIDTHS[type] || 120;
    });

    table.style.setProperty("width", `${total}px`, "important");
    table.style.setProperty("min-width", `${total}px`, "important");
    table.style.setProperty("max-width", `${total}px`, "important");
  }

  async function loadStatuses(force = false) {
    if (statusesLoaded && !force) return statusMap;
    if (statusesLoading) return statusesLoading;

    statusesLoading = (async () => {
      try {
        const res = await authFetch(STATUS_API_GET, {
          method: "GET",
          mode: "cors",
          headers: { "Accept": "application/json" }
        });
        
        let data = {};
        try { data = await res.json(); } catch(e) {}
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        statusMap.clear();
        const list = Array.isArray(data) ? data : (Array.isArray(data?.statuses) ? data.statuses : null);

        if (list) {
          list.forEach(entry => {
            if (!entry || typeof entry !== "object") return;
            const keys = Object.keys(entry);
            const ccKey = keys.find(k => /cc\s*number/i.test(k));
            if (!ccKey) return;
            const cc = normalizeCc(entry[ccKey]);
            if (!cc) return;

            const curKey = keys.find(k => /^current\s*status$/i.test(k));
            const priKey = keys.find(k => /^priority$/i.test(k));
            const opeKey = keys.find(k => /^open\s*day$/i.test(k));

            statusMap.set(cc, {
              [FIELD_CURRENT_STATUS]: curKey ? String(entry[curKey] ?? "").trim() : "",
              [FIELD_PRIORITY]:       priKey ? String(entry[priKey] ?? "").trim() : "",
              [FIELD_OPEN_DAY]:       opeKey ? entry[opeKey] : null
            });
          });
        }

        try {
          localStorage.setItem("cc_status_cache", JSON.stringify(Array.from(statusMap.entries())));
        } catch(_) {}

        statusesLoaded = true;
      } catch (err) {
        if (err.isAuthError) return;
        console.error("loadStatuses failed:", err);
        
        try {
          const cached = localStorage.getItem("cc_status_cache");
          if (cached && statusMap.size === 0) {
            JSON.parse(cached).forEach(([cc, val]) => statusMap.set(cc, val));
          }
        } catch(_) {}
      } finally {
        statusesLoading = null;
      }
      return statusMap;
    })();

    return statusesLoading;
  }

  function getStatusEntry(cc) {
    if (!cc) return { [FIELD_CURRENT_STATUS]: "", [FIELD_PRIORITY]: "", [FIELD_OPEN_DAY]: null };
    const cur = statusMap.get(cc);
    return cur || { [FIELD_CURRENT_STATUS]: "", [FIELD_PRIORITY]: "", [FIELD_OPEN_DAY]: null };
  }

  async function saveStatusEntry(ccNumber, entry, changedFields) {
    const fields = Array.isArray(changedFields) && changedFields.length
      ? changedFields
      : [FIELD_CURRENT_STATUS, FIELD_PRIORITY, FIELD_OPEN_DAY];

    const body = { "CC NUMBER": ccNumber };
    fields.forEach(f => {
      body[f] = f === FIELD_OPEN_DAY ? entry[f] : (entry[f] || "");
    });

    const res = await authFetch(STATUS_API_POST, {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(body)
    });

    let data = {};
    try { data = await res.json(); } catch(e) {}
    
    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status} Lỗi khi lưu.`);
    }

    let merged = null;
    if (data && data.record && typeof data.record === "object") merged = data.record;

    if (merged) {
      statusMap.set(ccNumber, {
        [FIELD_CURRENT_STATUS]: String(merged[FIELD_CURRENT_STATUS] ?? "").trim(),
        [FIELD_PRIORITY]:       String(merged[FIELD_PRIORITY] ?? "").trim(),
        [FIELD_OPEN_DAY]:       merged[FIELD_OPEN_DAY] ?? null
      });
    } else {
      statusMap.set(ccNumber, { ...entry });
    }
    
    try {
      localStorage.setItem("cc_status_cache", JSON.stringify(Array.from(statusMap.entries())));
    } catch(_) {}

    return true;
  }

  function extractCustomerNames(data) {
    if (Array.isArray(data)) {
      return data.map(entry => {
        if (typeof entry === "string") return entry;
        if (entry && typeof entry === "object") {
          const key = Object.keys(entry).find(k => /customer/i.test(k));
          return key ? entry[key] : Object.values(entry)[0];
        }
        return "";
      });
    }
    if (data && typeof data === "object") {
      const arrKey = Object.keys(data).find(k => Array.isArray(data[k]));
      if (arrKey) return extractCustomerNames(data[arrKey]);
    }
    return [];
  }

  async function loadCustomerList(group) {
    if (customerListCache[group]) return customerListCache[group];

    const res = await fetch(CUSTOMER_LIST_SOURCES[group]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const names = extractCustomerNames(data).map(normalize).filter(Boolean);
    const set = new Set(names);
    customerListCache[group] = set;
    return set;
  }

  async function setCustomerGroup(group) {
    const nextGroup = filters.customerGroup === group ? null : group;

    if (nextGroup) {
      try {
        await loadCustomerList(nextGroup);
      } catch (err) {
        console.error(err);
        alert(`Cannot load ${CUSTOMER_LIST_SOURCES[nextGroup]}`);
        return;
      }
    }

    filters.customerGroup = nextGroup;
    natBtn.classList.toggle("active", nextGroup === "nat");
    natBtn.setAttribute("aria-pressed", String(nextGroup === "nat"));
    otherBtn.classList.toggle("active", nextGroup === "other");
    otherBtn.setAttribute("aria-pressed", String(nextGroup === "other"));

    applyFilters();
  }

      const showCharts = prev.title === ONGOING_DETAIL_TITLE;
      detailChartsData = prev.chartsData || null;
      detailChartsVisibleMobile = !!prev.chartsVisibleMobile;

      if (showCharts && detailChartsData) {
        renderDetailCharts();
      } else {
        clearDetailCharts();
      }
      updateDetailChartsVisibility();

      renderDetailTable();

      hideAllViews();
      detailView.style.display = "block";
      pageTitle.textContent = TITLE_DETAIL;
      updateHeaderOffset();

      requestAnimationFrame(() => {
        window.scrollTo(0, prev.scrollY || 0);
      });
      return;
    }

    hideAllViews();
    graphView.style.display = "block";
    graphModeBtn.style.display = "none";
    basicModeBtn.style.display = "";
    pageTitle.textContent = TITLE_GRAPH;
    updateHeaderOffset();
    window.scrollTo(0, savedGraphScrollY);
  });

  function hideAllViews() {
    basicView.style.display = "none";
    graphView.style.display = "none";
    detailView.style.display = "none";
  }

  function showBasicView() {
    hideAllViews();
    basicView.style.display = "block";
    graphModeBtn.style.display = "";
    basicModeBtn.style.display = "none";
    pageTitle.textContent = TITLE_BASIC;
    resetSliceInteraction();
    updateHeaderOffset();
  }

  async function showGraphView() {
    closeContentModal();
    hideAllViews();
    graphView.style.display = "block";
    graphModeBtn.style.display = "none";
    basicModeBtn.style.display = "";
    pageTitle.textContent = TITLE_GRAPH;
    updateHeaderOffset();

    try {
      await ensureGraphData();
      renderAllCharts();
    } catch (err) {
      console.error(err);
      graphStatus.textContent = "Failed to load data2.json or NAT.json.";
      graphStatus.style.display = "block";
    }
  }

  async function ensureGraphData() {
    if (!graphLoaded) {
      graphStatus.textContent = "Loading graph data...";
      graphStatus.style.display = "block";
      const [res] = await Promise.all([
        fetch(GRAPH_DATA_SOURCE),
        loadCustomerList("nat")
      ]);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();

      graphData = raw.map(item => ({
        ...item,
        __customer: normalize(item["Customer"])
      }));

      graphLoaded = true;
      graphStatus.style.display = "none";
    }
    
    await loadStatuses(true);
  }

  // ============================================================
  // CHARTS (Graph view)
  // ============================================================
  function renderAllCharts() {
    resetSliceInteraction();

    const natSet = customerListCache.nat || new Set();
    const natRecords = graphData.filter(r => natSet.has(r.__customer));
    const totalNAT = natRecords.length;
    const totalAll = graphData.length;

    const onGoingRecords = natRecords.filter(r => (r["CASE STATUS"] || "").trim() === "On Going");
    const closedRecords = natRecords.filter(r => (r["CASE STATUS"] || "").trim() === "Closed");
    const otherStatusRecords = natRecords.filter(r => {
      const s = (r["CASE STATUS"] || "").trim();
      return s !== "On Going" && s !== "Closed";
    });

    const openCloseSlices = [
      {
        label: "On Going",
        value: onGoingRecords.length,
        color: "#fb8c00",
        records: onGoingRecords,
        detailTitle: ONGOING_DETAIL_TITLE
      },
      {
        label: "Closed",
        value: closedRecords.length,
        color: "#43a047",
        records: closedRecords,
        detailTitle: "NA Open-Close Case — Closed"
      }
    ];
    if (otherStatusRecords.length > 0) {
      openCloseSlices.push({
        label: "Other / Unspecified",
        value: otherStatusRecords.length,
        color: "#bdbdbd",
        records: otherStatusRecords,
        detailTitle: "NA Open-Close Case — Other / Unspecified"
      });
    }
    renderPieCard(chartOpenClose, "NA Open-Close Case", openCloseSlices, totalNAT);

    renderPieCard(
      chartNaInquiry,
      "NA Inquiry type",
      buildInquirySlices(natRecords, "NA Inquiry type"),
      totalNAT
    );

    renderPieCard(
      chartFmvInquiry,
      "FMV Inquiry type",
      buildInquirySlices(graphData, "FMV Inquiry type"),
      totalAll
    );

    renderBarCard(chartFmvRank, "FMV rank", buildCustomerRank(graphData));

    renderNaRankCard(chartNaRank, "NA rank", buildNaRankEntries(natRecords));
  }

  function buildInquirySlices(records, chartTitle) {
    const counts = new Map();
    const groups = new Map();
    records.forEach(r => {
      const key = String(r["Inquiry type"] ?? "").trim() || "Unspecified";
      counts.set(key, (counts.get(key) || 0) + 1);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => {
        const matching = groups.get(label);
        return {
          label,
          value,
          color: CHART_PALETTE[i % CHART_PALETTE.length],
          records: matching,
          detailTitle: `${chartTitle} — ${label}`
        };
      });
  }

  function buildCustomerRank(records) {
    const counts = new Map();
    const groups = new Map();
    records.forEach(r => {
      const key = String(r["Customer"] ?? "").trim() || "Unknown";
      counts.set(key, (counts.get(key) || 0) + 1);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    return [...counts.entries()]
      .map(([label, value]) => {
        const matching = groups.get(label);
        return {
          label,
          value,
          records: matching,
          detailTitle: `FMV rank — ${label}`
        };
      })
      .sort((a, b) => b.value - a.value);
  }

  function buildNaRankEntries(records) {
    const groups = new Map();

    records.forEach(r => {
      const label = String(r["Customer"] ?? "").trim() || "Unknown";
      if (!groups.has(label)) {
        groups.set(label, { total: [], closed: [], ongoing: [] });
      }
      const bucket = groups.get(label);
      bucket.total.push(r);

      const st = (r["CASE STATUS"] || "").trim();
      if (st === "Closed") bucket.closed.push(r);
      else if (st === "On Going") bucket.ongoing.push(r);
    });

    return [...groups.entries()]
      .map(([label, b]) => ({
        label,
        totalCount: b.total.length,
        closedCount: b.closed.length,
        ongoingCount: b.ongoing.length,
        totalRecords: b.total,
        closedRecords: b.closed,
        ongoingRecords: b.ongoing
      }))
      .sort((a, b) => b.totalCount - a.totalCount);
  }

  function renderPieCard(container, title, slices, total) {
    container.replaceChildren();

    const h3 = document.createElement("h3");
    h3.textContent = title;
    container.appendChild(h3);

    if (!total) {
      const empty = document.createElement("p");
      empty.className = "chart-empty";
      empty.textContent = "No data available.";
      container.appendChild(empty);
      return;
    }

    const body = document.createElement("div");
    body.className = "chart-body";

    const svgWrap = document.createElement("div");
    svgWrap.className = "chart-svg-wrap";
    svgWrap.appendChild(buildDonutSvg(total, slices));
    body.appendChild(svgWrap);

    const legend = document.createElement("ul");
    legend.className = "chart-legend";
    slices.forEach(slice => legend.appendChild(buildLegendItem(slice, total)));
    body.appendChild(legend);

    container.appendChild(body);
  }

  function buildDonutSvg(total, slices) {
    const svgNS = "http://www.w3.org/2000/svg";
    const size = 200;
    const radius = 70;
    const thickness = 28;
    const cx = size / 2;
    const cy = size / 2;
    const circumference = 2 * Math.PI * radius;

    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);

    const track = document.createElementNS(svgNS, "circle");
    track.setAttribute("cx", cx);
    track.setAttribute("cy", cy);
    track.setAttribute("r", radius);
    track.setAttribute("fill", "none");
    track.setAttribute("stroke", "#334155");
    track.setAttribute("stroke-width", thickness);
    svg.appendChild(track);

    let offsetAccum = 0;
    slices.forEach(slice => {
      if (slice.value <= 0) return;
      const dash = (slice.value / total) * circumference;
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", radius);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", slice.color);
      circle.setAttribute("stroke-width", thickness);
      circle.setAttribute("stroke-dasharray", `${dash} ${circumference - dash}`);
      circle.setAttribute("stroke-dashoffset", String(-offsetAccum));
      circle.classList.add("pie-slice");

      circle.style.transformOrigin = `${cx}px ${cy}px`;
      circle.style.transform = "rotate(-90deg)";
      circle.dataset.baseTransform = "rotate(-90deg)";

      circle.addEventListener("click", (evt) => toggleSlice(circle, slice, total, evt));

      svg.appendChild(circle);
      offsetAccum += dash;
    });

    const totalText = document.createElementNS(svgNS, "text");
    totalText.setAttribute("x", cx);
    totalText.setAttribute("y", cy - 3);
    totalText.setAttribute("text-anchor", "middle");
    totalText.setAttribute("font-size", "22");
    totalText.setAttribute("font-weight", "bold");
    totalText.setAttribute("fill", "#e2e8f0");
    totalText.textContent = String(total);
    svg.appendChild(totalText);

    const subText = document.createElementNS(svgNS, "text");
    subText.setAttribute("x", cx);
    subText.setAttribute("y", cy + 16);
    subText.setAttribute("text-anchor", "middle");
    subText.setAttribute("font-size", "11");
    subText.setAttribute("fill", "#94a3b8");
    subText.textContent = "records";
    svg.appendChild(subText);

    return svg;
  }

  function toggleSlice(circle, slice, total, evt) {
    if (activeSliceEl === circle) {
      clearSliceTimer();
      if (detailView.style.display === "block") {
        openDetailViewFromDetail(slice.detailTitle, slice.records);
      } else {
        openDetailView(slice.detailTitle, slice.records);
      }
      return;
    }
    if (activeSliceEl) {
      clearSliceTimer();
      deactivateSlice(activeSliceEl);
    }
    activateSlice(circle, slice, total, evt);
  }

  function activateSlice(circle, slice, total, evt) {
    circle.classList.add("active");
    circle.style.transform = `${circle.dataset.baseTransform} scale(1.10)`;
    activeSliceEl = circle;
    showSliceTooltip(slice, total, evt);

    clearSliceTimer();
    sliceResetTimer = setTimeout(() => {
      if (activeSliceEl === circle) deactivateSlice(circle);
      sliceResetTimer = null;
    }, SLICE_RESET_MS);
  }

  function deactivateSlice(circle) {
    circle.classList.remove("active");
    circle.style.transform = circle.dataset.baseTransform || "";
    if (activeSliceEl === circle) activeSliceEl = null;
    hideSliceTooltip();
  }

  function clearSliceTimer() {
    if (sliceResetTimer) {
      clearTimeout(sliceResetTimer);
      sliceResetTimer = null;
    }
  }

  function resetSliceInteraction() {
    clearSliceTimer();
    if (activeSliceEl) {
      activeSliceEl.classList.remove("active");
      activeSliceEl.style.transform = activeSliceEl.dataset.baseTransform || "";
      activeSliceEl = null;
    }
    hideSliceTooltip();
  }

  function showSliceTooltip(slice, total, evt) {
    const pct = total > 0 ? (slice.value / total) * 100 : 0;
    sliceTooltip.replaceChildren();

    const title = document.createElement("span");
    title.className = "tooltip-title";
    title.textContent = slice.label;

    const detail = document.createElement("span");
    detail.textContent = `${slice.value} record (${pct.toFixed(1)}%) · tap again to view`;

    sliceTooltip.append(title, detail);

    const point = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
    const x = point.clientX ?? window.innerWidth / 2;
    const y = point.clientY ?? window.innerHeight / 2;

    sliceTooltip.style.left = `${x}px`;
    sliceTooltip.style.top = `${Math.max(y - 12, 40)}px`;
    sliceTooltip.classList.add("show");
  }

  function hideSliceTooltip() {
    sliceTooltip.classList.remove("show");
  }

  function buildLegendItem(slice, total) {
    const li = document.createElement("li");

    const dot = document.createElement("span");
    dot.className = "legend-dot";
    dot.style.background = slice.color;

    const label = document.createElement("span");
    label.className = "legend-label";
    label.textContent = slice.label;
    label.title = slice.label;

    const value = document.createElement("span");
    value.className = "legend-value";
    const pct = total > 0 ? (slice.value / total) * 100 : 0;
    value.textContent = `${slice.value} (${pct.toFixed(1)}%)`;

    li.append(dot, label, value);

    li.title = "Click to view records";
    li.addEventListener("click", () => {
      if (detailView.style.display === "block") {
        openDetailViewFromDetail(slice.detailTitle, slice.records);
      } else {
        openDetailView(slice.detailTitle, slice.records);
      }
    });

    return li;
  }

  function renderBarCard(container, title, entries) {
    container.replaceChildren();

    const h3 = document.createElement("h3");
    h3.textContent = title;
    container.appendChild(h3);

    if (entries.length === 0) {
      const empty = document.createElement("p");
      empty.className = "chart-empty";
      empty.textContent = "No data available.";
      container.appendChild(empty);
      return;
    }

    const maxValue = entries[0].value;
    const list = document.createElement("div");
    list.className = "bar-chart-list";

    entries.forEach(entry => {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.title = `Click to view ${entry.value} record(s)`;

      const label = document.createElement("span");
      label.className = "bar-label";
      label.textContent = entry.label;
      label.title = entry.label;

      const track = document.createElement("span");
      track.className = "bar-track";
      const fill = document.createElement("span");
      fill.className = "bar-fill";
      fill.style.width = `${maxValue > 0 ? (entry.value / maxValue) * 100 : 0}%`;
      track.appendChild(fill);

      const value = document.createElement("span");
      value.className = "bar-value";
      value.textContent = String(entry.value);

      row.append(label, track, value);
      row.addEventListener("click", () => openDetailView(entry.detailTitle, entry.records));

      list.appendChild(row);
    });

    container.appendChild(list);
  }

  function renderNaRankCard(container, title, entries) {
    container.replaceChildren();

    const h3 = document.createElement("h3");
    h3.textContent = title;
    container.appendChild(h3);

    if (entries.length === 0) {
      const empty = document.createElement("p");
      empty.className = "chart-empty";
      empty.textContent = "No data available.";
      container.appendChild(empty);
      return;
    }

    const maxTotal = entries.reduce((m, e) => Math.max(m, e.totalCount), 0);

    const list = document.createElement("div");
    list.className = "na-rank-list";

    const addBar = (rowEl, tagText, count, maxValue, colorClass, records, detailTitle) => {
      const bar = document.createElement("div");
      bar.className = "na-rank-bar";
      bar.title = `Click to view ${count} record(s)`;

      const tag = document.createElement("span");
      tag.className = "na-rank-bar-tag";
      tag.textContent = tagText;

      const track = document.createElement("span");
      track.className = "na-rank-track";
      const fill = document.createElement("span");
      fill.className = `na-rank-fill ${colorClass}`;
      fill.style.width = `${maxValue > 0 ? (count / maxValue) * 100 : 0}%`;
      track.appendChild(fill);

      const val = document.createElement("span");
      val.className = "na-rank-value";
      val.textContent = String(count);

      bar.append(tag, track, val);
      bar.addEventListener("click", () => openDetailView(detailTitle, records));

      rowEl.appendChild(bar);
    };

    entries.forEach(entry => {
      const row = document.createElement("div");
      row.className = "na-rank-row";

      const label = document.createElement("div");
      label.className = "na-rank-label";
      label.textContent = entry.label;
      label.title = entry.label;
      row.appendChild(label);

      const barsWrap = document.createElement("div");
      barsWrap.className = "na-rank-bars";

      addBar(barsWrap, "Total", entry.totalCount, maxTotal, "total",
        entry.totalRecords, `NA rank — ${entry.label} (Total)`);
      addBar(barsWrap, "Closed", entry.closedCount, maxTotal, "closed",
        entry.closedRecords, `NA rank — ${entry.label} (Closed)`);
      addBar(barsWrap, "On Going", entry.ongoingCount, maxTotal, "ongoing",
        entry.ongoingRecords, `NA rank — ${entry.label} (On Going)`);

      row.appendChild(barsWrap);
      list.appendChild(row);
    });

    container.appendChild(list);

    const legend = document.createElement("div");
    legend.className = "na-rank-legend";

    const legendItem = (label, color) => {
      const item = document.createElement("span");
      item.className = "item";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = color;
      const text = document.createElement("span");
      text.textContent = label;
      item.append(dot, text);
      return item;
    };

    legend.appendChild(legendItem("Total", "#1976d2"));
    legend.appendChild(legendItem("Closed", "#43a047"));
    legend.appendChild(legendItem("On Going", "#fb8c00"));

    container.appendChild(legend);
  }
