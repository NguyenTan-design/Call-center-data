<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link
    rel="icon"
    type="image/png"
    href="customer-service.png"
>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Management</title>
<style>
  :root {
    --primary: #1976d2;
    --primary-dark: #0d5db8;
    --border: #ddd;
    --row-alt: #fafafa;
    --row-hover: #eef6ff;
    --cell-line-height: 1.4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
  }

  h1 {
    position: sticky;
    top: 0;
    z-index: 60;
    margin: 0 0 15px;
    padding: 12px 0;
    text-align: center;
    color: #333;
    background: #f5f5f5;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .08);
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  .toolbar input[type="text"] {
    flex: 1 1 200px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .toggle-btn {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid var(--primary);
    border-radius: 6px;
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }

  .toggle-btn:hover { background: #eaf3fd; }

  .toggle-btn.active {
    background: var(--primary);
    color: #fff;
  }

  #clear-filters {
    flex: 0 0 auto;
    padding: 10px 14px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #555;
    cursor: pointer;
  }

  #clear-filters:hover {
    background: #f0f0f0;
  }

  #status {
    font-size: 13px;
    color: #777;
    margin: 0 0 8px;
    text-align: center;
  }

  .table-wrapper {
    background: #fff;
    border-radius: 8px;
    overflow: auto;
    height: calc(100vh - 190px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--primary);
    color: #fff;
    z-index: 10;
  }

  th, td {
    border: 1px solid var(--border);
    padding: 8px;
    font-size: 13px;
    vertical-align: top;
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }

  th:nth-child(1), td:nth-child(1) { width: 10%; }
  th:nth-child(2), td:nth-child(2) { width: 10%; color: red; font-weight: bold; }
  th:nth-child(3), td:nth-child(3) { width: 15%; }
  th:nth-child(4), td:nth-child(4) { width: 25%; }
  th:nth-child(5), td:nth-child(5) { width: 25%; }
  th:nth-child(6), td:nth-child(6) { width: 8%; }
  th:nth-child(7), td:nth-child(7) { width: 7%; text-align: center; }

  /* --- Cell text handling ---
     Default: single line, no wrap, ellipsis if it overflows.
     TOPIC column: always shows full text and wraps normally; it drives
     the row's actual height. Every other column's value is clamped by
     JS (adjustRowHeights) to match that same height, ellipsis if cut off. */
  .cell-value {
    display: block;
    width: 100%;
    line-height: var(--cell-line-height);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  td[data-label="TOPIC"] .cell-value {
    white-space: normal;
    overflow-wrap: break-word;
    text-overflow: clip;
  }

  .cell-value.clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    line-clamp: var(--clamp-lines, 3);
    -webkit-line-clamp: var(--clamp-lines, 3);
    white-space: normal;
    overflow-wrap: break-word;
  }

  /* Communication Content cells are clickable to reveal full text */
  td[data-label="COMMUNICATION CONTENT"] {
    cursor: pointer;
  }

  td[data-label="COMMUNICATION CONTENT"]:hover {
    background: #e3f0fd;
  }

  .action-btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 5px;
  }

  .action-btn:hover { background: var(--primary-dark); }

  .empty-row td {
    text-align: center;
    color: #999;
    padding: 20px;
  }

  #pagination {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }

  #pagination button {
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }

  #pagination button:disabled {
    cursor: not-allowed;
    opacity: .5;
  }

  /* --- Communication Content modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal-box {
    background: #fff;
    border-radius: 8px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--primary);
    color: #fff;
    border-radius: 8px 8px 0 0;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 16px;
  }

  .modal-close {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }

  .modal-close:hover {
    opacity: .8;
  }

  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
  }

  /* --- Graph mode / Basic mode buttons --- */
  .mode-btn {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid #2e7d32;
    border-radius: 6px;
    background: #2e7d32;
    color: #fff;
    cursor: pointer;
  }

  .mode-btn:hover { background: #24632a; }

  /* --- Graph view layout --- */
  #graph-view { display: none; }

  .graph-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    position: sticky;
    top: var(--header-height, 60px);
    z-index: 55;
    background: #f5f5f5;
    padding: 8px 0;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .08);
  }

  .graph-title {
    margin: 0;
    color: #333;
    font-size: 18px;
  }

  #graph-status {
    font-size: 13px;
    color: #777;
    margin: 0 0 8px;
    text-align: center;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .chart-card {
    background: #eceff1;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    padding: 16px;
  }

  .chart-card-wide {
    grid-column: 1 / -1;
  }

  .chart-card h3 {
    margin: 0 0 12px;
    text-align: center;
    color: #333;
    font-size: 15px;
  }

  .chart-empty {
    text-align: center;
    color: #999;
    font-size: 13px;
    padding: 20px 0;
  }

  .chart-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .chart-svg-wrap svg { display: block; }

  /* Pie chart slices are tappable: elevate with a 3D-ish drop shadow and
     grow slightly when active; tapping the same slice again reverts it. */
  .chart-svg-wrap circle.pie-slice {
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
  }

  .chart-svg-wrap circle.pie-slice:hover {
    filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .3));
  }

  .chart-svg-wrap circle.pie-slice.active {
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .45));
  }

  /* Floating popup showing the tapped slice's value */
  .slice-tooltip {
    position: fixed;
    transform: translate(-50%, -100%);
    background: #222;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: opacity .15s ease;
  }

  .slice-tooltip.show {
    opacity: 1;
    visibility: visible;
  }

  .slice-tooltip .tooltip-title {
    display: block;
    font-weight: bold;
    margin-bottom: 2px;
  }

  .chart-legend {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 320px;
  }

  .chart-legend li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 12.5px;
    color: #333;
    border-bottom: 1px solid #f0f0f0;
  }

  .legend-dot {
    flex: 0 0 auto;
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }

  .legend-label {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-value {
    flex: 0 0 auto;
    color: #666;
    font-variant-numeric: tabular-nums;
  }

  /* Chart 4 - FMV rank bar chart */
  .bar-chart-list {
    max-height: 460px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 160px 1fr 34px;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 12.5px;
  }

  .bar-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #333;
  }

  .bar-track {
    position: relative;
    display: block;
    height: 14px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    display: block;
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
  }

  .bar-value {
    text-align: right;
    color: #666;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 768px) {
    body { padding: 8px; }

    h1 { font-size: 22px; margin-bottom: 10px; }

    .toolbar { gap: 8px; }
    .toolbar input[type="text"] { flex: 1 1 100%; font-size: 13px; padding: 9px; }
    .toggle-btn, #clear-filters, .mode-btn { flex: 1 1 auto; text-align: center; padding: 9px 10px; font-size: 13px; }

    #pagination { flex-wrap: wrap; justify-content: space-between; }
    #pagination strong { flex: 1 1 100%; order: 2; text-align: center; font-size: 12px; }

    .table-wrapper {
      height: auto;
      max-height: calc(100vh - 300px);
      box-shadow: none;
      background: transparent;
    }

    table { table-layout: fixed; }
    th, td { font-size: 9px; padding: 3px; }
    th { font-size: 10px; }

    .modal-box { max-height: 90vh; }

    .charts-grid { grid-template-columns: 1fr; }
    .graph-toolbar { flex-direction: column; align-items: stretch; }
    .bar-row { grid-template-columns: 100px 1fr 30px; font-size: 11px; }
  }
</style>
</head>
<body>

<h1>NA TEAM CC Management</h1>

<div id="basic-view">
  <div class="toolbar">
    <input id="search-cc" type="text" placeholder="Search CC Number">
    <input id="search-topic" type="text" placeholder="Search Topic">
    <input id="search-content" type="text" placeholder="Search Communication Content">
    <button id="filter-new" class="toggle-btn" type="button" aria-pressed="false">NEW only</button>
    <button id="filter-nat" class="toggle-btn" type="button" aria-pressed="false">NAT</button>
    <button id="filter-other" class="toggle-btn" type="button" aria-pressed="false">OTHER</button>
    <button id="clear-filters" type="button">Clear</button>
    <button id="graph-mode-btn" class="mode-btn" type="button">📊 Graph mode</button>
  </div>

  <p id="status">Loading data...</p>

  <div id="pagination"></div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>DATE</th>
          <th>CC NUMBER</th>
          <th>CUSTOMER</th>
          <th>TOPIC</th>
          <th>COMMUNICATION CONTENT</th>
          <th>FMV PIC</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="graph-view">
  <div class="graph-toolbar">
    <h2 class="graph-title">Graph Mode - NA TEAM Overview</h2>
    <button id="basic-mode-btn" class="mode-btn" type="button">⬅ Basic mode</button>
  </div>

  <p id="graph-status">Loading graph data...</p>

  <div class="charts-grid">
    <div class="chart-card" id="chart-open-close"></div>
    <div class="chart-card" id="chart-na-inquiry"></div>
    <div class="chart-card" id="chart-fmv-inquiry"></div>
    <div class="chart-card chart-card-wide" id="chart-fmv-rank"></div>
  </div>
</div>

<div id="slice-tooltip" class="slice-tooltip"></div>

<div id="content-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Communication Content</h2>
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const ROWS_PER_PAGE = 50;
  const SEARCH_DEBOUNCE_MS = 200;
  const RESIZE_DEBOUNCE_MS = 150;
  const NEW_KEYWORD = "new";
  const CONTENT_LABEL = "COMMUNICATION CONTENT";

  // Fields shown in each row, in column order, paired with the label
  // used both in <thead> and as each cell's data-label.
  const COLUMNS = [
    { field: "DATE", label: "DATE" },
    { field: "CC NUMBER", label: "CC NUMBER" },
    { field: "Customer", label: "CUSTOMER" },
    { field: "TOPIC", label: "TOPIC" },
    { field: "Communication Content", label: CONTENT_LABEL },
    { field: "FMV PIC", label: "FMV PIC" }
  ];

  // Maps each per-column search box to the precomputed lowercase key on a record.
  const FIELD_MAP = {
    cc: { field: "CC NUMBER", key: "__cc" },
    topic: { field: "TOPIC", key: "__topic" },
    content: { field: "Communication Content", key: "__content" }
  };

  // NAT / OTHER buttons don't replace the dataset — they load a list of
  // customer names from NAT.json / OTHER.json and filter data.json rows
  // whose CUSTOMER matches something in that list.
  const CUSTOMER_LIST_SOURCES = {
    nat: "NAT.json",
    other: "OTHER.json"
  };

  const customerListCache = {}; // "nat" | "other" -> Set of normalized customer names

  // Graph mode reads a separate dataset (different columns than data.json).
  const GRAPH_DATA_SOURCE = "data2.json";

  // Colour palette used for pie-chart slices / bar-chart entries.
  const CHART_PALETTE = [
    "#1976d2", "#e53935", "#43a047", "#fb8c00", "#8e24aa",
    "#00897b", "#c0ca33", "#6d4c41", "#3949ab", "#d81b60",
    "#00acc1", "#f4511e"
  ];

  let allData = [];       // all records from data.json (with precomputed search fields)
  let filteredData = [];  // current filtered view
  let currentPage = 1;
  let openContentCell = null; // the <td> currently shown in the modal, or null

  let graphData = null;    // records from data2.json, once loaded
  let graphLoaded = false; // true once graphData + NAT list are ready

  const filters = {
    cc: "",
    topic: "",
    content: "",
    newOnly: false,
    customerGroup: null  // null | "nat" | "other"
  };

  const tbody = document.getElementById("tbody");
  const pagination = document.getElementById("pagination");
  const status = document.getElementById("status");

  const ccInput = document.getElementById("search-cc");
  const topicInput = document.getElementById("search-topic");
  const contentInput = document.getElementById("search-content");
  const newBtn = document.getElementById("filter-new");
  const natBtn = document.getElementById("filter-nat");
  const otherBtn = document.getElementById("filter-other");
  const clearBtn = document.getElementById("clear-filters");

  const contentModal = document.getElementById("content-modal");
  const modalBody = document.getElementById("modal-body");
  const modalClose = document.getElementById("modal-close");

  const basicView = document.getElementById("basic-view");
  const graphView = document.getElementById("graph-view");
  const graphModeBtn = document.getElementById("graph-mode-btn");
  const basicModeBtn = document.getElementById("basic-mode-btn");
  const graphStatus = document.getElementById("graph-status");
  const chartOpenClose = document.getElementById("chart-open-close");
  const chartNaInquiry = document.getElementById("chart-na-inquiry");
  const chartFmvInquiry = document.getElementById("chart-fmv-inquiry");
  const chartFmvRank = document.getElementById("chart-fmv-rank");

  const pageTitle = document.querySelector("h1");
  const sliceTooltip = document.getElementById("slice-tooltip");
  let activeSliceEl = null; // the pie-slice <circle> currently elevated/popped, or null

  init();

  async function init() {
    try {
      const res = await fetch("data.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      allData = data.map(item => ({
        ...item,
        __cc: String(item["CC NUMBER"] ?? "").toLowerCase(),
        __topic: String(item["TOPIC"] ?? "").toLowerCase(),
        __content: String(item["Communication Content"] ?? "").toLowerCase(),
        __customer: normalize(item["Customer"])
      }));

      filteredData = allData;
      status.remove();
      renderTable();
    } catch (err) {
      console.error(err);
      status.textContent = "Failed to load data.json.";
    }
  }

  function normalize(text) {
    return String(text ?? "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  // Accepts several possible NAT.json / OTHER.json shapes:
  // ["Customer A", "Customer B"]  or  [{"Customer": "Customer A"}, ...]
  // or an object wrapping an array under some key, e.g. {"customers": [...]}.
  function extractCustomerNames(data) {
    if (Array.isArray(data)) {
      return data.map(entry => {
        if (typeof entry === "string") return entry;
        if (entry && typeof entry === "object") {
          const key = Object.keys(entry).find(k => /customer/i.test(k));
          return key ? entry[key] : Object.values(entry)[0];
        }
        return "";
      });
    }
    if (data && typeof data === "object") {
      const arrKey = Object.keys(data).find(k => Array.isArray(data[k]));
      if (arrKey) return extractCustomerNames(data[arrKey]);
    }
    return [];
  }

  // Fetches + caches the customer name list for "nat" or "other".
  async function loadCustomerList(group) {
    if (customerListCache[group]) return customerListCache[group];

    const res = await fetch(CUSTOMER_LIST_SOURCES[group]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const names = extractCustomerNames(data).map(normalize).filter(Boolean);
    const set = new Set(names);
    customerListCache[group] = set;
    return set;
  }

  async function setCustomerGroup(group) {
    // Clicking the already-active button turns the filter back off.
    const nextGroup = filters.customerGroup === group ? null : group;

    if (nextGroup) {
      try {
        await loadCustomerList(nextGroup);
      } catch (err) {
        console.error(err);
        alert(`Cannot load ${CUSTOMER_LIST_SOURCES[nextGroup]}`);
        return;
      }
    }

    filters.customerGroup = nextGroup;
    natBtn.classList.toggle("active", nextGroup === "nat");
    natBtn.setAttribute("aria-pressed", String(nextGroup === "nat"));
    otherBtn.classList.toggle("active", nextGroup === "other");
    otherBtn.setAttribute("aria-pressed", String(nextGroup === "other"));

    applyFilters();
  }

  ccInput.addEventListener("input", debounce(() => {
    filters.cc = ccInput.value.trim().toLowerCase();
    applyFilters();
  }, SEARCH_DEBOUNCE_MS));

  topicInput.addEventListener("input", debounce(() => {
    filters.topic = topicInput.value.trim().toLowerCase();
    applyFilters();
  }, SEARCH_DEBOUNCE_MS));

  contentInput.addEventListener("input", debounce(() => {
    filters.content = contentInput.value.trim().toLowerCase();
    applyFilters();
  }, SEARCH_DEBOUNCE_MS));

  newBtn.addEventListener("click", () => {
    filters.newOnly = !filters.newOnly;
    newBtn.classList.toggle("active", filters.newOnly);
    newBtn.setAttribute("aria-pressed", String(filters.newOnly));
    applyFilters();
  });

  // NAT / OTHER act as a single-select group filter: clicking the active
  // one turns it back off (shows every customer again).
  natBtn.addEventListener("click", () => setCustomerGroup("nat"));
  otherBtn.addEventListener("click", () => setCustomerGroup("other"));

  clearBtn.addEventListener("click", () => {
    filters.cc = "";
    filters.topic = "";
    filters.content = "";
    filters.newOnly = false;
    filters.customerGroup = null;

    ccInput.value = "";
    topicInput.value = "";
    contentInput.value = "";
    newBtn.classList.remove("active");
    newBtn.setAttribute("aria-pressed", "false");
    natBtn.classList.remove("active");
    natBtn.setAttribute("aria-pressed", "false");
    otherBtn.classList.remove("active");
    otherBtn.setAttribute("aria-pressed", "false");

    applyFilters();
  });

  window.addEventListener("resize", debounce(adjustRowHeights, RESIZE_DEBOUNCE_MS));
  window.addEventListener("resize", debounce(updateHeaderOffset, RESIZE_DEBOUNCE_MS));
  updateHeaderOffset();

  // Measures the sticky title's rendered height (+ its margin) so the
  // Graph mode toolbar can stick directly below it, edge to edge.
  function updateHeaderOffset() {
    if (!pageTitle) return;
    const marginBottom = parseFloat(getComputedStyle(pageTitle).marginBottom) || 0;
    const headerHeight = pageTitle.offsetHeight + marginBottom;
    document.documentElement.style.setProperty("--header-height", `${headerHeight}px`);
  }

  // --- Graph mode / Basic mode switch ---
  graphModeBtn.addEventListener("click", showGraphView);
  basicModeBtn.addEventListener("click", showBasicView);

  function showBasicView() {
    graphView.style.display = "none";
    basicView.style.display = "block";
    resetSliceInteraction();
  }

  async function showGraphView() {
    closeContentModal();
    basicView.style.display = "none";
    graphView.style.display = "block";

    try {
      await ensureGraphData();
      renderAllCharts();
    } catch (err) {
      console.error(err);
      graphStatus.textContent = "Failed to load data2.json or NAT.json.";
      graphStatus.style.display = "block";
    }
  }

  // Loads data2.json (once) plus the NAT customer list (reusing the same
  // cache/loader the NAT toggle button in Basic mode uses).
  async function ensureGraphData() {
    if (graphLoaded) return;

    graphStatus.textContent = "Loading graph data...";
    graphStatus.style.display = "block";

    const [res] = await Promise.all([
      fetch(GRAPH_DATA_SOURCE),
      loadCustomerList("nat")
    ]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();

    graphData = raw.map(item => ({
      ...item,
      __customer: normalize(item["Customer"])
    }));

    graphLoaded = true;
    graphStatus.style.display = "none";
  }

  function renderAllCharts() {
    resetSliceInteraction();

    const natSet = customerListCache.nat || new Set();
    const natRecords = graphData.filter(r => natSet.has(r.__customer));
    const totalNAT = natRecords.length;
    const totalAll = graphData.length;

    // Chart 1: NA Open-Close Case — 100% = all NAT records; slices = the
    // "On Going" / "Closed" share of CASE STATUS within them. Any NAT
    // record whose status is neither is grouped as "Other / Unspecified"
    // so the pie still adds up to all NAT records.
    const onGoing = natRecords.filter(r => (r["CASE STATUS"] || "").trim() === "On Going").length;
    const closed = natRecords.filter(r => (r["CASE STATUS"] || "").trim() === "Closed").length;
    const otherStatus = totalNAT - onGoing - closed;
    const openCloseSlices = [
      { label: "On Going", value: onGoing, color: "#fb8c00" },
      { label: "Closed", value: closed, color: "#43a047" }
    ];
    if (otherStatus > 0) {
      openCloseSlices.push({ label: "Other / Unspecified", value: otherStatus, color: "#bdbdbd" });
    }
    renderPieCard(chartOpenClose, "NA Open-Close Case", openCloseSlices, totalNAT);

    // Chart 2: NA Inquiry type — 100% = all NAT records, split by Inquiry type.
    renderPieCard(chartNaInquiry, "NA Inquiry type", buildInquirySlices(natRecords), totalNAT);

    // Chart 3: FMV Inquiry type — 100% = all records, split by Inquiry type.
    renderPieCard(chartFmvInquiry, "FMV Inquiry type", buildInquirySlices(graphData), totalAll);

    // Chart 4: FMV rank — bar chart of case count per Customer, sorted desc.
    renderBarCard(chartFmvRank, "FMV rank", buildCustomerRank(graphData));
  }

  function buildInquirySlices(records) {
    const counts = new Map();
    records.forEach(r => {
      const key = String(r["Inquiry type"] ?? "").trim() || "Unspecified";
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => ({ label, value, color: CHART_PALETTE[i % CHART_PALETTE.length] }));
  }

  function buildCustomerRank(records) {
    const counts = new Map();
    records.forEach(r => {
      const key = String(r["Customer"] ?? "").trim() || "Unknown";
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    return [...counts.entries()]
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value);
  }

  // Renders a donut/pie chart (SVG) plus a text legend into a chart card.
  function renderPieCard(container, title, slices, total) {
    container.replaceChildren();

    const h3 = document.createElement("h3");
    h3.textContent = title;
    container.appendChild(h3);

    if (!total) {
      const empty = document.createElement("p");
      empty.className = "chart-empty";
      empty.textContent = "No data available.";
      container.appendChild(empty);
      return;
    }

    const body = document.createElement("div");
    body.className = "chart-body";

    const svgWrap = document.createElement("div");
    svgWrap.className = "chart-svg-wrap";
    svgWrap.appendChild(buildDonutSvg(total, slices));
    body.appendChild(svgWrap);

    const legend = document.createElement("ul");
    legend.className = "chart-legend";
    slices.forEach(slice => legend.appendChild(buildLegendItem(slice, total)));
    body.appendChild(legend);

    container.appendChild(body);
  }

  function buildDonutSvg(total, slices) {
    const svgNS = "http://www.w3.org/2000/svg";
    const size = 200;
    const radius = 70;
    const thickness = 28;
    const cx = size / 2;
    const cy = size / 2;
    const circumference = 2 * Math.PI * radius;

    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);

    const track = document.createElementNS(svgNS, "circle");
    track.setAttribute("cx", cx);
    track.setAttribute("cy", cy);
    track.setAttribute("r", radius);
    track.setAttribute("fill", "none");
    track.setAttribute("stroke", "#eee");
    track.setAttribute("stroke-width", thickness);
    svg.appendChild(track);

    let offsetAccum = 0;
    slices.forEach(slice => {
      if (slice.value <= 0) return;
      const dash = (slice.value / total) * circumference;
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", radius);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", slice.color);
      circle.setAttribute("stroke-width", thickness);
      circle.setAttribute("stroke-dasharray", `${dash} ${circumference - dash}`);
      circle.setAttribute("stroke-dashoffset", String(-offsetAccum));
      circle.classList.add("pie-slice");

      // The base rotation (so 0% starts at 12 o'clock) is set via CSS
      // transform rather than the SVG "transform" attribute, so it can be
      // combined with a "scale up" transform on tap without one clobbering
      // the other.
      circle.style.transformOrigin = `${cx}px ${cy}px`;
      circle.style.transform = "rotate(-90deg)";
      circle.dataset.baseTransform = "rotate(-90deg)";

      circle.addEventListener("click", (evt) => toggleSlice(circle, slice, total, evt));

      svg.appendChild(circle);
      offsetAccum += dash;
    });

    const totalText = document.createElementNS(svgNS, "text");
    totalText.setAttribute("x", cx);
    totalText.setAttribute("y", cy - 3);
    totalText.setAttribute("text-anchor", "middle");
    totalText.setAttribute("font-size", "22");
    totalText.setAttribute("font-weight", "bold");
    totalText.setAttribute("fill", "#333");
    totalText.textContent = String(total);
    svg.appendChild(totalText);

    const subText = document.createElementNS(svgNS, "text");
    subText.setAttribute("x", cx);
    subText.setAttribute("y", cy + 16);
    subText.setAttribute("text-anchor", "middle");
    subText.setAttribute("font-size", "11");
    subText.setAttribute("fill", "#888");
    subText.textContent = "records";
    svg.appendChild(subText);

    return svg;
  }

  // Tapping a pie slice pops it up (3D-ish elevation) and shows a popup
  // with its value; tapping that same slice again reverts it to normal.
  function toggleSlice(circle, slice, total, evt) {
    if (activeSliceEl === circle) {
      deactivateSlice(circle);
      return;
    }
    if (activeSliceEl) deactivateSlice(activeSliceEl);
    activateSlice(circle, slice, total, evt);
  }

  function activateSlice(circle, slice, total, evt) {
    circle.classList.add("active");
    circle.style.transform = `${circle.dataset.baseTransform} scale(1.08)`;
    activeSliceEl = circle;
    showSliceTooltip(slice, total, evt);
  }

  function deactivateSlice(circle) {
    circle.classList.remove("active");
    circle.style.transform = circle.dataset.baseTransform || "";
    if (activeSliceEl === circle) activeSliceEl = null;
    hideSliceTooltip();
  }

  function resetSliceInteraction() {
    activeSliceEl = null;
    hideSliceTooltip();
  }

  function showSliceTooltip(slice, total, evt) {
    const pct = total > 0 ? (slice.value / total) * 100 : 0;
    sliceTooltip.replaceChildren();

    const title = document.createElement("span");
    title.className = "tooltip-title";
    title.textContent = slice.label;

    const detail = document.createElement("span");
    detail.textContent = `${slice.value} record (${pct.toFixed(1)}%)`;

    sliceTooltip.append(title, detail);

    const point = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
    const x = point.clientX ?? window.innerWidth / 2;
    const y = point.clientY ?? window.innerHeight / 2;

    sliceTooltip.style.left = `${x}px`;
    sliceTooltip.style.top = `${Math.max(y - 12, 40)}px`;
    sliceTooltip.classList.add("show");
  }

  function hideSliceTooltip() {
    sliceTooltip.classList.remove("show");
  }

  function buildLegendItem(slice, total) {
    const li = document.createElement("li");

    const dot = document.createElement("span");
    dot.className = "legend-dot";
    dot.style.background = slice.color;

    const label = document.createElement("span");
    label.className = "legend-label";
    label.textContent = slice.label;
    label.title = slice.label;

    const value = document.createElement("span");
    value.className = "legend-value";
    const pct = total > 0 ? (slice.value / total) * 100 : 0;
    value.textContent = `${slice.value} (${pct.toFixed(1)}%)`;

    li.append(dot, label, value);
    return li;
  }

  // Renders a horizontal bar chart (plain HTML/CSS bars) into a chart card.
  function renderBarCard(container, title, entries) {
    container.replaceChildren();

    const h3 = document.createElement("h3");
    h3.textContent = title;
    container.appendChild(h3);

    if (entries.length === 0) {
      const empty = document.createElement("p");
      empty.className = "chart-empty";
      empty.textContent = "No data available.";
      container.appendChild(empty);
      return;
    }

    const maxValue = entries[0].value;
    const list = document.createElement("div");
    list.className = "bar-chart-list";

    entries.forEach(entry => {
      const row = document.createElement("div");
      row.className = "bar-row";

      const label = document.createElement("span");
      label.className = "bar-label";
      label.textContent = entry.label;
      label.title = entry.label;

      const track = document.createElement("span");
      track.className = "bar-track";
      const fill = document.createElement("span");
      fill.className = "bar-fill";
      fill.style.width = `${maxValue > 0 ? (entry.value / maxValue) * 100 : 0}%`;
      track.appendChild(fill);

      const value = document.createElement("span");
      value.className = "bar-value";
      value.textContent = String(entry.value);

      row.append(label, track, value);
      list.appendChild(row);
    });

    container.appendChild(list);
  }

  // --- Communication Content modal wiring ---
  // Clicking a COMMUNICATION CONTENT cell opens the modal with its full
  // text. Clicking that same cell again closes it (acts as a toggle).
  tbody.addEventListener("click", (e) => {
    const td = e.target.closest(`td[data-label="${CONTENT_LABEL}"]`);
    if (!td) return;
    toggleContentModal(td);
  });

  modalClose.addEventListener("click", closeContentModal);

  // Click on the dark backdrop (not the box itself) closes the modal.
  contentModal.addEventListener("click", (e) => {
    if (e.target === contentModal) closeContentModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && contentModal.classList.contains("show")) {
      closeContentModal();
    }
  });

  function toggleContentModal(td) {
    if (openContentCell === td) {
      closeContentModal();
      return;
    }
    const valueEl = td.querySelector(".cell-value");
    const fullText = (valueEl ? valueEl.textContent : td.textContent) || "(empty)";
    modalBody.textContent = fullText;
    contentModal.classList.add("show");
    openContentCell = td;
  }

  function closeContentModal() {
    contentModal.classList.remove("show");
    openContentCell = null;
  }

  function debounce(fn, delay) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  function applyFilters() {
    const activeList = filters.customerGroup
      ? customerListCache[filters.customerGroup]
      : null;

    filteredData = allData.filter(item =>
      (filters.cc === "" || item[FIELD_MAP.cc.key].includes(filters.cc)) &&
      (filters.topic === "" || item[FIELD_MAP.topic.key].includes(filters.topic)) &&
      (filters.content === "" || item[FIELD_MAP.content.key].includes(filters.content)) &&
      (!filters.newOnly || item[FIELD_MAP.cc.key].includes(NEW_KEYWORD)) &&
      (!activeList || activeList.has(item.__customer))
    );

    currentPage = 1;
    renderTable();
  }

  function renderTable() {
    // The modal, if open, refers to a <td> that is about to be replaced.
    closeContentModal();

    const start = (currentPage - 1) * ROWS_PER_PAGE;
    const pageData = filteredData.slice(start, start + ROWS_PER_PAGE);
    const fragment = document.createDocumentFragment();

    if (pageData.length === 0) {
      const tr = document.createElement("tr");
      tr.className = "empty-row";
      const td = document.createElement("td");
      td.colSpan = COLUMNS.length + 1;
      td.textContent = "No matching records.";
      tr.appendChild(td);
      fragment.appendChild(tr);
    } else {
      for (const item of pageData) {
        fragment.appendChild(buildRow(item));
      }
    }

    tbody.replaceChildren(fragment);
    renderPagination();

    // Wait a frame so the browser has laid out the TOPIC cell's wrapped
    // text before we measure it and clamp the other cells to match.
    requestAnimationFrame(adjustRowHeights);
  }

  function buildRow(item) {
    const tr = document.createElement("tr");

    for (const col of COLUMNS) {
      const td = document.createElement("td");
      td.dataset.label = col.label;

      const value = document.createElement("span");
      value.className = "cell-value";
      value.textContent = item[col.field] ?? "";
      td.appendChild(value);

      tr.appendChild(td);
    }

    const actionTd = document.createElement("td");
    actionTd.dataset.label = "ACTION";
    const link = document.createElement("a");
    link.className = "action-btn";
    link.href = item["GO TO WEB"] || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open";
    actionTd.appendChild(link);
    tr.appendChild(actionTd);

    return tr;
  }

  // Measures each row's TOPIC cell (which always shows full, wrapped
  // text) and clamps every other cell's value to that same number of
  // lines, so the row height is driven only by TOPIC.
  function adjustRowHeights() {
    const rows = tbody.querySelectorAll("tr:not(.empty-row)");

    rows.forEach(tr => {
      const topicValue = tr.querySelector('td[data-label="TOPIC"] .cell-value');
      if (!topicValue) return;

      const lineHeight = parseFloat(getComputedStyle(topicValue).lineHeight) || 16;
      const maxLines = Math.max(1, Math.round(topicValue.offsetHeight / lineHeight));

      tr.querySelectorAll(
        'td:not([data-label="TOPIC"]):not([data-label="ACTION"]) .cell-value'
      ).forEach(span => {
        span.style.setProperty("--clamp-lines", maxLines);
        span.classList.add("clamp");
      });
    });
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(filteredData.length / ROWS_PER_PAGE));
    pagination.replaceChildren();

    if (filteredData.length <= ROWS_PER_PAGE) {
      const strong = document.createElement("strong");
      strong.textContent = `Total: ${filteredData.length} records`;
      pagination.appendChild(strong);
      return;
    }

    const prev = document.createElement("button");
    prev.textContent = "Prev";
    prev.disabled = currentPage === 1;
    prev.onclick = () => { currentPage--; renderTable(); };

    const info = document.createElement("strong");
    info.textContent = `Page ${currentPage} / ${totalPages}  |  Total ${filteredData.length} records`;

    const next = document.createElement("button");
    next.textContent = "Next";
    next.disabled = currentPage === totalPages;
    next.onclick = () => { currentPage++; renderTable(); };

    pagination.append(prev, info, next);
  }
})();
</script>

</body>
